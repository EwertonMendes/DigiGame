; Browsers may block audible WebAudio until the document has real HTML user
; activation. Attempt startup immediately, then resume the Godot context from
; trusted activation events anywhere in the page and after focus/visibility
; recovery. Gamepad polling is intentionally not treated as user activation.
html/head_include="<script>(()=>{'use strict';const k='__digigameWebAudioBootstrap';if(window[k])return;const Native=window.AudioContext||window.webkitAudioContext;if(!Native)return;const state={contexts:new Set(),resumeAttempts:0,lastReason:'',lastTrustedEvent:'',policy:'unknown'};window[k]=state;const activation=()=>!navigator.userActivation||navigator.userActivation.isActive||navigator.userActivation.hasBeenActive;const policy=()=>{try{if(typeof navigator.getAutoplayPolicy==='function')state.policy=navigator.getAutoplayPolicy('audiocontext');}catch(_e){}};const resume=(reason)=>{policy();state.lastReason=reason;for(const ctx of state.contexts){if(ctx.state==='running')continue;state.resumeAttempts++;Promise.resolve(ctx.resume()).catch(()=>{});}};const onTrusted=(event)=>{if(!event.isTrusted||!activation())return;state.lastTrustedEvent=event.type;resume(event.type);};for(const type of ['keydown','mousedown','pointerup','touchend'])document.addEventListener(type,onTrusted,{capture:true,passive:true});window.addEventListener('focus',()=>{if(activation())resume('focus');},true);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&activation())resume('visibilitychange');},true);const register=(ctx)=>{state.contexts.add(ctx);ctx.addEventListener('statechange',()=>{if(ctx.state!=='running'&&activation())resume('statechange');});resume('startup');};const Wrapped=function(...args){const ctx=Reflect.construct(Native,args,Native);register(ctx);return ctx;};Object.setPrototypeOf(Wrapped,Native);Wrapped.prototype=Native.prototype;try{if(window.AudioContext===Native)window.AudioContext=Wrapped;if(window.webkitAudioContext===Native)window.webkitAudioContext=Wrapped;}catch(_e){}policy();})();</script>"

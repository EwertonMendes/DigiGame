html/custom_html_shell=""
; Godot Web resumes a suspended AudioContext from keyboard, pointer and touch
; callbacks, but gamepad buttons are polled and do not pass through that path.
; Capture the engine context before startup, attempt autoplay immediately, and
; retry only while suspended when browser/user or controller activation appears.
html/head_include="<script>(()=>{'use strict';const k='__digigameWebAudioBootstrap';if(window[k])return;const Native=window.AudioContext||window.webkitAudioContext;if(!Native)return;const state={contexts:new Set(),lastPads:new Map(),resumeAttempts:0,raf:0};window[k]=state;const schedule=()=>{if(!state.raf)state.raf=requestAnimationFrame(scan);};const resume=()=>{for(const ctx of state.contexts){if(ctx.state==='running')continue;state.resumeAttempts++;Promise.resolve(ctx.resume()).catch(()=>{});}};const scan=()=>{state.raf=0;let activate=!!(navigator.userActivation&&navigator.userActivation.hasBeenActive);try{const pads=navigator.getGamepads?navigator.getGamepads():[];for(const pad of pads){if(!pad)continue;const active=pad.buttons.some((b)=>b.pressed||b.value>=0.5)||pad.axes.some((v)=>Math.abs(v)>=0.6);const previous=state.lastPads.get(pad.index)||false;state.lastPads.set(pad.index,active);if(active&&!previous)activate=true;}}catch(_e){}if(activate)resume();let pending=false;for(const ctx of state.contexts){if(ctx.state!=='running'){pending=true;break;}}if(pending)schedule();};const register=(ctx)=>{state.contexts.add(ctx);ctx.addEventListener('statechange',()=>{if(ctx.state!=='running')schedule();});resume();schedule();};const Wrapped=function(...args){const ctx=Reflect.construct(Native,args,Native);register(ctx);return ctx;};Object.setPrototypeOf(Wrapped,Native);Wrapped.prototype=Native.prototype;try{if(window.AudioContext===Native)window.AudioContext=Wrapped;if(window.webkitAudioContext===Native)window.webkitAudioContext=Wrapped;}catch(_e){}schedule();})();</script>"

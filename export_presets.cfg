html/head_include="<style>html,body{margin:0!important;padding:0!important;overflow:hidden!important;background:#010206;}#canvas{display:block!important;position:fixed!important;margin:0!important;touch-action:none;}</style><script>(()=>{let frame=0;const fit=()=>{const canvas=document.getElementById('canvas');if(!canvas)return;const vv=window.visualViewport;const width=Math.max(1,Math.floor(vv?vv.width:window.innerWidth));const height=Math.max(1,Math.floor(vv?vv.height:window.innerHeight));const left=Math.floor(vv?vv.offsetLeft:0);const top=Math.floor(vv?vv.offsetTop:0);const dpr=window.devicePixelRatio||1;const pixelWidth=Math.max(1,Math.floor(width*dpr));const pixelHeight=Math.max(1,Math.floor(height*dpr));canvas.style.left=left+'px';canvas.style.top=top+'px';canvas.style.width=width+'px';canvas.style.height=height+'px';if(canvas.width!==pixelWidth)canvas.width=pixelWidth;if(canvas.height!==pixelHeight)canvas.height=pixelHeight;document.documentElement.style.width=width+'px';document.documentElement.style.height=height+'px';document.body.style.width=width+'px';document.body.style.height=height+'px';};const schedule=()=>{if(frame)return;frame=requestAnimationFrame(()=>{frame=0;fit();});};window.addEventListener('resize',schedule,{passive:true});window.addEventListener('orientationchange',schedule,{passive:true});window.addEventListener('pageshow',schedule,{passive:true});if(window.visualViewport){window.visualViewport.addEventListener('resize',schedule,{passive:true});window.visualViewport.addEventListener('scroll',schedule,{passive:true});}document.addEventListener('DOMContentLoaded',schedule,{once:true});schedule();})();</script>"

name: Temporary DS Sprite Sample Fetch

on:
  push:
    branches:
      - feature/early-rank-digimon-roster

permissions:
  contents: read

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch supplemental DWDS-style sprites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ds-samples
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://i1136.photobucket.com/albums/n483/PixelDots/Digimon%20Sprites/1Dodomon.png' -o /tmp/ds-samples/dodomon.png
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://i1136.photobucket.com/albums/n483/PixelDots/Digimon%20Sprites/Pichimon.png' -o /tmp/ds-samples/pichimon.png
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://i1136.photobucket.com/albums/n483/PixelDots/Digimon%20Sprites/motimon_sprite_by_wooded_wolf-d4ai2kv.gif' -o /tmp/ds-samples/motimon.gif
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://i1136.photobucket.com/albums/n483/PixelDots/Digimon%20Sprites/bukamon_sprite_by_wooded_wolf-d4ai84c.gif' -o /tmp/ds-samples/bukamon.gif
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://i1136.photobucket.com/albums/n483/PixelDots/Digimon%20Sprites/Flamemon_zpsb381aecd.gif' -o /tmp/ds-samples/flamemon.gif
          file /tmp/ds-samples/*
      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ds-sprite-samples
          path: /tmp/ds-samples
          retention-days: 1

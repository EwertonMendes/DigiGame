name: Temporary Early-Rank DS Field Generator

on:
  push:
    branches:
      - feature/early-rank-digimon-roster
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install sprite tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages pillow numpy scipy flask requests beautifulsoup4

      - name: Prepare pinned DS sprite source manager
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ds-manager
          git clone --quiet https://github.com/netraular/DigimonWorldSpriteManager.git /tmp/ds-manager
          git -C /tmp/ds-manager checkout --quiet 06b3c4df09dc5eeaccee511d731f37947b1c8259
          python3 /tmp/ds-manager/Scripts/download_sheets.py --delay 0.02

      - name: Build all early-rank DS field sprites
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_early_rank_ds_fields.py --manager /tmp/ds-manager

      - name: Validate generated field roster
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_early_rank_playables.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('database/early-rank-playables.json').read_text(encoding='utf-8'))
          assert manifest['count'] == 87
          assert all(row.get('visual_mode') == 'directional_12' for row in manifest['species'])
          assert all(Path(row['field_sprite'].replace('res://', '')).is_file() for row in manifest['species'])
          print('validated 87 directional early-rank field sprites')
          PY

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters assets/resources database/early-rank-playables.json tools/build_early_rank_ds_fields.py tools/validate_early_rank_playables.py tools/test_early_rank_playables.gd
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'feat: wire early-rank roster to DS field sprites'
          git push origin HEAD:feature/early-rank-digimon-roster

name: Temporary DS Sprite Sample Fetch

on:
  push:
    branches:
      - feature/early-rank-digimon-roster

permissions:
  contents: read

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch source pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ds-samples
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://www.mediafire.com/file/lk0pjupv8n88006/sprite_thread.zip/file' -o /tmp/ds-samples/mediafire.html
          python3 - <<'PY'
          import html, re
          from pathlib import Path
          page=Path('/tmp/ds-samples/mediafire.html').read_text('utf-8','ignore')
          m=re.search(r'href="([^"]+)"\s+id="downloadButton"', page)
          if not m:
              raise SystemExit('MediaFire direct link not found')
          url=html.unescape(m.group(1))
          print(url)
          Path('/tmp/ds-samples/mediafire-download-url.txt').write_text(url+'\n')
          PY
          curl -fL --retry 3 -A 'Mozilla/5.0' "$(cat /tmp/ds-samples/mediafire-download-url.txt)" -o /tmp/ds-samples/sprite_thread.zip
          unzip -l /tmp/ds-samples/sprite_thread.zip | head -120 > /tmp/ds-samples/archive-list.txt
          file /tmp/ds-samples/sprite_thread.zip
      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ds-sprite-samples
          path: /tmp/ds-samples
          retention-days: 1

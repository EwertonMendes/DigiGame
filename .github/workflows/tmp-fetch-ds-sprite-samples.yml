name: Temporary DS Sprite Sample Fetch

on:
  push:
    branches:
      - feature/early-rank-digimon-roster

permissions:
  contents: read

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch source samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ds-samples
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://i874.photobucket.com/albums/ab308/WtWSprites/Child/031_Patamon.png' -o /tmp/ds-samples/patamon-sheet.png
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://i997.photobucket.com/albums/af96/WtWAnimatedSprites/Child/031Patamon.gif' -o /tmp/ds-samples/patamon-animated.gif
          file /tmp/ds-samples/*
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in Path('/tmp/ds-samples').iterdir():
              im=Image.open(p)
              print(p.name, im.size, im.mode, getattr(im, 'n_frames', 1))
          PY
      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: ds-sprite-samples
          path: /tmp/ds-samples
          retention-days: 1

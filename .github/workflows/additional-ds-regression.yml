name: Additional DS sprite regression

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/additional-ds-regression.yml'
      - 'project.godot'
      - 'assets/characters/**'
      - 'assets/resources/**'
      - 'database/additional-ds-playables.json'
      - 'database/ds-additional-sources.json'
      - 'database/ds-direction-registry.json'
      - 'database/ds-directional-resource-audit.json'
      - 'tools/build_additional_ds_fields.py'
      - 'tools/build_early_rank_ds_fields.py'
      - 'tools/validate_additional_ds_fields.py'
      - 'tools/validate_all_ds_directional_facings.py'
      - 'tools/test_additional_ds_playables.gd'
      - 'tools/test_additional_ds_playables.tscn'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Install Python sprite tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy scipy

      - name: Verify deterministic generated assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_additional_ds_fields.py
          python3 tools/validate_additional_ds_fields.py
          python3 tools/validate_all_ds_directional_facings.py
          git diff --exit-code -- \
            assets/characters \
            assets/resources \
            database/additional-ds-playables.json \
            database/ds-directional-resource-audit.json

      - name: Restore Godot runtime cache
        id: godot-runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/digigame-godot/godot
          key: godot-runtime-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot on cache miss
        if: steps.godot-runtime.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-stable"
          mkdir -p "$HOME/.cache/digigame-godot"
          curl -fL "https://github.com/godotengine/godot/releases/download/${TAG}/Godot_v${TAG}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${TAG}_linux.x86_64" "$HOME/.cache/digigame-godot/godot"
          chmod +x "$HOME/.cache/digigame-godot/godot"

      - name: Activate Godot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$HOME/.cache/digigame-godot/godot"
          sudo ln -sf "$HOME/.cache/digigame-godot/godot" /usr/local/bin/godot

      - name: Restore imported-resource cache
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.gd', '**/*.tscn', '**/*.tres', 'assets/**/*') }}
          restore-keys: |
            godot-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Import project
        run: godot --headless --path . --import

      - name: Exercise battle, overworld and menu sprite consumers
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . tools/test_additional_ds_playables.tscn 2>&1 | tee /tmp/additional-ds.log
          grep -q 'additional DS playable regression passed' /tmp/additional-ds.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' /tmp/additional-ds.log; then exit 1; fi

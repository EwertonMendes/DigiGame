name: Evolution Chart card polish (temporary)

on:
  push:
    branches:
      - feat/focused-evolution-chart
    paths:
      - .github/workflows/evolution-card-polish-temp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/focused-evolution-chart
          fetch-depth: 0

      - name: Polish digital particles and card backgrounds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/ui/EvolutionChartCanvas.gd')
          text = path.read_text(encoding='utf-8')

          old_constants = '''const LINK_SIGNAL_PRIMARY_SPEED := 0.10
          const LINK_SIGNAL_SECONDARY_SPEED := 0.075
          const DIGITAL_PARTICLE_CYCLE := 1.55
          const DIGITAL_PARTICLE_MIN_RISE := 28.0
          const DIGITAL_PARTICLE_MAX_RISE := 58.0
          const CURRENT_DIGITAL_PARTICLES := 22
          const SELECTED_DIGITAL_PARTICLES := 14
          const NAVIGATION_TWEEN_DURATION := 0.18'''
          new_constants = '''const LINK_SIGNAL_PRIMARY_SPEED := 0.10
          const LINK_SIGNAL_SECONDARY_SPEED := 0.075
          const DIGITAL_PARTICLE_CYCLE := 2.35
          const DIGITAL_PARTICLE_MIN_RISE := 30.0
          const DIGITAL_PARTICLE_MAX_RISE := 62.0
          const CURRENT_DIGITAL_PARTICLES := 24
          const SELECTED_DIGITAL_PARTICLES := 16
          const CARD_BACKDROP_INSET := 5.0
          const CARD_BACKDROP_BASE := Color(0.004, 0.009, 0.020, 0.94)
          const CARD_BACKDROP_LINEAGE := Color(0.004, 0.018, 0.026, 0.95)
          const CARD_BACKDROP_SELECTED := Color(0.003, 0.024, 0.036, 0.96)
          const CARD_BACKDROP_CURRENT := Color(0.034, 0.022, 0.004, 0.96)
          const CARD_BACKDROP_GOAL := Color(0.022, 0.010, 0.032, 0.95)
          const NAVIGATION_TWEEN_DURATION := 0.18'''
          if old_constants not in text:
              raise SystemExit('Expected digital VFX constants block was not found')
          text = text.replace(old_constants, new_constants, 1)

          old_create = '''func _create_node_button(node: Dictionary) -> Button:
          \tvar button := super._create_node_button(node)
          \tvar status := _find_status_label(button)'''
          new_create = '''func _create_node_button(node: Dictionary) -> Button:
          \tvar button := super._create_node_button(node)
          \t# Every chart card owns a persistent dark inner surface. It is a child of the
          \t# button rather than part of a hover style, so focus/hover can never make the
          \t# card transparent and the decorative Kenney border remains visible around it.
          \tvar backdrop := ColorRect.new()
          \tbackdrop.name = "CardBackdrop"
          \tbackdrop.set_anchors_preset(Control.PRESET_FULL_RECT)
          \tbackdrop.offset_left = CARD_BACKDROP_INSET
          \tbackdrop.offset_top = CARD_BACKDROP_INSET
          \tbackdrop.offset_right = -CARD_BACKDROP_INSET
          \tbackdrop.offset_bottom = -CARD_BACKDROP_INSET
          \tbackdrop.color = CARD_BACKDROP_BASE
          \tbackdrop.mouse_filter = Control.MOUSE_FILTER_IGNORE
          \tbutton.add_child(backdrop)
          \tbutton.move_child(backdrop, 0)
          \tvar status := _find_status_label(button)'''
          if old_create not in text:
              raise SystemExit('Expected _create_node_button anchor was not found')
          text = text.replace(old_create, new_create, 1)

          old_style_anchor = '''\t\tSKIN.apply_button(button, accent)
          \t\tbutton.modulate.a = 1.0 if primary_lookup.has(seed) or seed == _selected_seed or seed == _current_seed else 0.88'''
          new_style_anchor = '''\t\tSKIN.apply_button(button, accent)
          \t\tvar backdrop := button.get_node_or_null("CardBackdrop") as ColorRect
          \t\tif backdrop != null:
          \t\t\tvar backdrop_color := CARD_BACKDROP_BASE
          \t\t\tif primary_lookup.has(seed):
          \t\t\t\tbackdrop_color = CARD_BACKDROP_LINEAGE
          \t\t\tif seed == _goal_seed:
          \t\t\t\tbackdrop_color = CARD_BACKDROP_GOAL
          \t\t\tif seed == _selected_seed:
          \t\t\t\tbackdrop_color = CARD_BACKDROP_SELECTED
          \t\t\tif seed == _current_seed:
          \t\t\t\tbackdrop_color = CARD_BACKDROP_CURRENT
          \t\t\tbackdrop.color = backdrop_color
          \t\tbutton.modulate.a = 1.0 if primary_lookup.has(seed) or seed == _selected_seed or seed == _current_seed else 0.88'''
          if old_style_anchor not in text:
              raise SystemExit('Expected card style anchor was not found')
          text = text.replace(old_style_anchor, new_style_anchor, 1)

          old_draw_comment = '''\t# Digital data pixels originate just inside the card's top edge. Because the
          \t# canvas renders before Button children, the first part of each particle's life
          \t# is naturally masked by the card and it appears to dissolve out of the frame.
          \t# This avoids a rectangular emitter, texture atlas silhouette, or flame-like look.'''
          new_draw_comment = '''\t# Digital data pixels now travel from the lower edge through the full height of
          \t# the card and dissolve above it. They render behind the persistent dark card
          \t# surface, so the effect occupies a larger area without competing with text.'''
          if old_draw_comment not in text:
              raise SystemExit('Expected digital VFX draw comment was not found')
          text = text.replace(old_draw_comment, new_draw_comment, 1)

          particle_pattern = re.compile(
              r'func _draw_digital_card_particles\(.*?\n\n\nfunc _draw_signal_packet',
              re.S,
          )
          particle_function = '''func _draw_digital_card_particles(
          \tseed: String,
          \tbase_color: Color,
          \tparticle_count: int,
          \tphase_offset: float,
          \tintensity: float
          ) -> void:
          \tvar button := _buttons.get(seed) as Button
          \tif button == null or not button.visible or particle_count <= 0:
          \t\treturn

          \tvar scale_factor := _button_scale(seed)
          \tvar card_size := NODE_SIZE * scale_factor
          \tvar card_left := button.position.x - 5.0 * scale_factor
          \tvar card_right := button.position.x + card_size.x + 5.0 * scale_factor
          \tvar card_top := button.position.y
          \tvar card_bottom := card_top + card_size.y
          \tvar seed_value := float(abs(seed.hash()) % 100000)

          \tfor index in range(particle_count):
          \t\tvar index_value := float(index + 1)
          \t\tvar x_noise := _digital_noise01(seed_value + index_value * 17.13)
          \t\tvar phase_noise := _digital_noise01(seed_value + index_value * 31.71)
          \t\tvar size_noise := _digital_noise01(seed_value + index_value * 47.29)
          \t\tvar rise_noise := _digital_noise01(seed_value + index_value * 71.91)
          \t\tvar drift_noise := _digital_noise01(seed_value + index_value * 89.53)
          \t\tvar alpha_noise := _digital_noise01(seed_value + index_value * 113.17)

          \t\tvar cycle := DIGITAL_PARTICLE_CYCLE * lerpf(0.84, 1.18, rise_noise)
          \t\tvar age := fposmod(_phase + phase_offset + phase_noise * cycle, cycle) / cycle
          \t\tvar fade_in := smoothstep(0.0, 0.10, age)
          \t\tvar fade_out := 1.0 - smoothstep(0.68, 1.0, age)
          \t\tvar alpha := fade_in * fade_out * intensity * lerpf(0.50, 0.94, alpha_noise)
          \t\tif alpha <= 0.015:
          \t\t\tcontinue

          \t\t# Start around the lower edge, then cross the entire card before fading
          \t\t# above its top edge. A tiny randomized inset avoids a visible emitter line.
          \t\tvar start_offset := lerpf(-7.0, 6.0, _digital_noise01(seed_value + index_value * 131.7)) * scale_factor
          \t\tvar rise := card_size.y + lerpf(DIGITAL_PARTICLE_MIN_RISE, DIGITAL_PARTICLE_MAX_RISE, rise_noise) * scale_factor
          \t\tvar drift := (drift_noise - 0.5) * 12.0 * scale_factor * age
          \t\tvar position := Vector2(
          \t\t\tlerpf(card_left, card_right, x_noise) + drift,
          \t\t\tcard_bottom + start_offset - rise * age
          \t\t)

          \t\tvar pixel_size := lerpf(1.8, 4.0, size_noise) * scale_factor
          \t\tvar pixel_rect := Rect2(
          \t\t\tposition - Vector2.ONE * pixel_size * 0.5,
          \t\t\tVector2.ONE * pixel_size
          \t\t)
          \t\tdraw_rect(pixel_rect, Color(base_color.r, base_color.g, base_color.b, alpha), true)

          \t\t# A minority of pixels leave one dim data-bit behind. This keeps the
          \t\t# movement readable as upward digital flow without turning into a streak.
          \t\tif int(floor(size_noise * 10.0)) % 3 == 0 and age > 0.14:
          \t\t\tvar trail_size := maxf(0.9 * scale_factor, pixel_size * 0.50)
          \t\t\tvar trail_position := position + Vector2(0.0, lerpf(5.0, 9.0, rise_noise) * scale_factor)
          \t\t\tvar trail_alpha := alpha * 0.24
          \t\t\tdraw_rect(
          \t\t\t\tRect2(trail_position - Vector2.ONE * trail_size * 0.5, Vector2.ONE * trail_size),
          \t\t\t\tColor(base_color.r, base_color.g, base_color.b, trail_alpha),
          \t\t\t\ttrue
          \t\t\t)


          func _draw_signal_packet'''
          text, count = particle_pattern.subn(particle_function, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one digital-particle function, replaced {count}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff --stat

      - name: Commit polished card presentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/evolution-card-polish-temp.yml
          git add src/ui/EvolutionChartCanvas.gd
          git commit -m "fix: deepen Evolution Chart cards and expand digital flow"
          git push origin HEAD:feat/focused-evolution-chart

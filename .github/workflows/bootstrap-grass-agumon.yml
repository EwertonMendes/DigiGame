name: Materialize Grass Agumon integration

on:
  push:
    branches:
      - feat/grass-agumon

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[skip grass-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install sprite tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy

      - name: Integrate project-original ownership into repository tooling
        run: python3 tools/bootstrap_grass_agumon_repo.py

      - name: Build Grass Agumon runtime assets and data
        run: python3 tools/build_project_original_playables.py

      - name: Regenerate permanent technique catalogue deterministically
        run: node tools/build_technique_catalog.mjs

      - name: Validate complete integration before committing
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/enrich_digimon_database.py --check
          python3 tools/validate_combat_data.py
          python3 tools/validate_digimon_progression.py
          python3 tools/validate_project_original_playables.py
          python3 tools/validate_early_rank_playables.py
          python3 tools/validate_all_ds_directional_facings.py

      - name: Commit materialized outputs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Grass Agumon integration is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: materialize Grass Agumon playable integration [skip grass-bootstrap]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

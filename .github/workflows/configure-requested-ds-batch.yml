name: Configure requested DS batch

on:
  push:
    branches:
      - fix/ds-sprite-agumon-line-veemon-batch

permissions:
  contents: write

jobs:
  configure:
    if: ${{ !contains(github.event.head_commit.message, '[skip batch-configure]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Apply audited source configuration
        run: python3 tools/apply_requested_ds_batch.py
      - name: Generate requested runtime assets
        run: python3 tools/build_additional_ds_fields.py
      - name: Validate requested runtime assets
        run: |
          python3 tools/validate_additional_ds_fields.py
          python3 tools/validate_all_ds_directional_facings.py
      - name: Commit generated production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_additional_ds_fields.py \
                  database/ds-additional-sources.json \
                  assets/characters \
                  assets/resources \
                  database/additional-ds-playables.json \
                  database/ds-directional-resource-audit.json
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "feat: add requested DS Digimon sprites [skip batch-configure]"
          git push origin HEAD:${{ github.ref_name }}

name: Normalize DS facing groups

on:
  push:
    branches:
      - fix/ds-sprite-facing-audit

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip facing-normalize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ds-sprite-facing-audit
      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Normalize four-facing DS sheets
        run: python3 tools/normalize_ds_four_facing_groups.py
      - name: Commit normalized sheets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No facing-group changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters database/ds-four-facing-normalization.json
          git commit -m "fix: align four-facing DS sheets with Agumon order [skip facing-normalize]"
          git push origin HEAD:fix/ds-sprite-facing-audit

name: DigiGame Headless Regressions

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/headless-regressions.yml'
      - 'project.godot'
      - 'src/**'
      - 'database/**'
      - 'assets/resources/**'
      - 'tools/test_*.gd'
      - 'tools/test_*.tscn'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digigame-headless-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  regression:
    name: Headless · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tile-selection
            command: godot --headless --path . tools/test_tile_based_selection.tscn --quit-after 5
            success: tile-based Digimon selection regression passed
          - name: isometric-keyboard
            command: godot --headless --path . tools/test_isometric_keyboard_navigation.tscn --quit-after 5
            success: isometric keyboard navigation regression passed
          - name: attack-patterns
            command: godot --headless --path . tools/test_attack_patterns.tscn --quit-after 5
            success: advanced attack pattern regression passed
          - name: hub-foundation
            command: godot --headless --path . tools/test_hub_foundation.tscn --quit-after 30
            success: hub foundation regression passed
          - name: digilab-layout
            command: godot --headless --path . tools/test_digilab_layout_regression.tscn --quit-after 30
            success: digilab layout regression passed
          - name: training-ui-v2
            command: godot --headless --path . tools/test_training_ui_v2_regression.tscn --quit-after 30
            success: training ui v2 regression passed
          - name: global-ui-v2
            command: godot --headless --path . tools/test_ui_v2_components_regression.tscn --quit-after 30
            success: global ui v2 components regression passed
          - name: battle-ui-lifecycle
            command: godot --headless --path . tools/test_battle_ui_lifecycle_regression.tscn --quit-after 30
            success: battle ui lifecycle regression passed
          - name: zeke-greymon
            command: godot --headless --path . tools/test_zeke_greymon_regression.tscn --quit-after 30
            success: zeke greymon regression passed
          - name: digimon-progression
            command: godot --headless --path . tools/test_digimon_progression.tscn --quit-after 8
            success: digimon progression regression passed
          - name: progression-loop-e2e
            command: godot --headless --path . tools/test_progression_loop_e2e.tscn --quit-after 20
            success: complete progression loop e2e regression passed
          - name: tier-and-footprints
            command: godot --headless --path . tools/test_tier_and_footprints.tscn --quit-after 12
            success: tier and tactical footprint regression passed
          - name: footprint-deployment
            command: godot --headless --path . -s tools/test_footprint_deployment.gd
            success: "[FootprintDeploymentTest] PASS"
          - name: expansion-footprint-integration
            command: godot --headless --path . tools/test_expansion_footprint_integration.tscn --quit-after 12
            success: "[ExpansionFootprintIntegrationTest] PASS"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Godot runtime cache
        id: godot-runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/digigame-godot/godot
          key: godot-runtime-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot on cache miss
        if: steps.godot-runtime.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-stable"
          mkdir -p "$HOME/.cache/digigame-godot"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_TAG}_linux.x86_64" "$HOME/.cache/digigame-godot/godot"
          chmod +x "$HOME/.cache/digigame-godot/godot"

      - name: Activate Godot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$HOME/.cache/digigame-godot/godot"
          sudo ln -sf "$HOME/.cache/digigame-godot/godot" /usr/local/bin/godot
          godot --version

      - name: Restore Godot imported-resource cache
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.gd', '**/*.tscn', '**/*.tres', 'assets/**/*') }}
          restore-keys: |
            godot-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/import.log; then exit 1; fi

      - name: Run regression
        shell: bash
        env:
          TEST_COMMAND: ${{ matrix.command }}
          SUCCESS_MARKER: ${{ matrix.success }}
        run: |
          set -euo pipefail
          bash -lc "$TEST_COMMAND" 2>&1 | tee /tmp/regression.log
          grep -Fq "$SUCCESS_MARKER" /tmp/regression.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' /tmp/regression.log; then exit 1; fi

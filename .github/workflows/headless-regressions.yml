name: DigiGame Core Headless Regressions

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/headless-regressions.yml'
      - 'project.godot'
      - 'src/**'
      - 'database/**'
      - 'tools/test_*.gd'
      - 'tools/test_*.tscn'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digigame-headless-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  core-regressions:
    name: Core gameplay regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Godot runtime cache
        id: godot-runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/digigame-godot/godot
          key: godot-runtime-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot on cache miss
        if: steps.godot-runtime.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-stable"
          mkdir -p "$HOME/.cache/digigame-godot"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip" -o /tmp/godot.zip
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_TAG}_linux.x86_64" "$HOME/.cache/digigame-godot/godot"
          chmod +x "$HOME/.cache/digigame-godot/godot"

      - name: Activate Godot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$HOME/.cache/digigame-godot/godot"
          sudo ln -sf "$HOME/.cache/digigame-godot/godot" /usr/local/bin/godot
          godot --version

      - name: Restore imported-resource cache
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.gd', '**/*.tscn', '**/*.tres', 'assets/**/*') }}
          restore-keys: |
            godot-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Import project once
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERR_FILE_CORRUPT' /tmp/import.log; then
            exit 1
          fi

      - name: Run critical gameplay suite
        shell: bash
        run: |
          set -euo pipefail

          run_regression() {
            local name="$1"
            local marker="$2"
            shift 2
            local log="/tmp/${name}.log"

            echo "::group::${name}"
            "$@" 2>&1 | tee "$log"

            if ! grep -Fq "$marker" "$log"; then
              echo "::error::${name} did not emit expected success marker: ${marker}"
              echo "::endgroup::"
              return 1
            fi

            local marker_line
            marker_line="$(grep -nF -m1 "$marker" "$log" | cut -d: -f1)"
            head -n "$marker_line" "$log" > "/tmp/${name}-before-success.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' "/tmp/${name}-before-success.log"; then
              echo "::endgroup::"
              return 1
            fi

            echo "::endgroup::"
          }

          run_regression digimon-progression \
            "digimon progression regression passed" \
            godot --headless --path . tools/test_digimon_progression.tscn --quit-after 8

          run_regression fusion-system \
            "fusion system regression passed" \
            godot --headless --path . tools/test_fusion_system.tscn --quit-after 10

          run_regression digilab-layout \
            "digilab layout regression passed" \
            godot --headless --path . tools/test_digilab_layout_regression.tscn --quit-after 20

          run_regression digimon-main-menu-ui \
            "digimon main menu ui regression passed" \
            godot --headless --path . tools/test_digimon_main_menu_ui_regression.tscn --quit-after 20

          run_regression squad-system \
            "squad system regression passed" \
            godot --headless --path . tools/test_squad_system.tscn --quit-after 10

          run_regression battle-squad-switching \
            "battle squad switching regression passed" \
            godot --headless --path . tools/test_battle_squad_switching.tscn --quit-after 10

          run_regression hospital-system \
            "hospital system regression passed" \
            godot --headless --path . tools/test_hospital_system.tscn --quit-after 8

          run_regression world-interiors \
            "seamless world interior regression passed" \
            godot --headless --path . tools/test_world_interior.tscn --quit-after 360

          run_regression battle-ui-lifecycle \
            "battle ui lifecycle regression passed" \
            godot --headless --path . tools/test_battle_ui_lifecycle_regression.tscn

          run_regression progression-loop-e2e \
            "complete progression loop e2e regression passed" \
            godot --headless --path . tools/test_progression_loop_e2e.tscn --quit-after 20

          run_regression battlefield-catalog \
            "[BattlefieldCatalogTest] PASS" \
            godot --headless --path . -s tools/test_battlefield_catalog.gd

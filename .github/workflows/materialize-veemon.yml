name: Materialize Veemon PNG

on:
  push:
    branches:
      - fix/veemon-rendering

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/veemon-rendering
          fetch-depth: 0
      - name: Decode and validate Veemon PNG
        shell: bash
        run: |
          set -euo pipefail
          base64 -d assets/characters/veemon.runtime.b64 > assets/characters/veemon.png
          python3 - <<'PY'
          from PIL import Image
          path = 'assets/characters/veemon.png'
          with Image.open(path) as image:
              image.verify()
          with Image.open(path) as image:
              assert image.size == (384, 32), image.size
          print('Veemon PNG validated: 384x32')
          PY
      - name: Commit materialized PNG
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/characters/veemon.png; then
            echo 'Veemon PNG already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/veemon.png
          git commit -m 'fix: materialize valid Veemon PNG'
          git push origin HEAD:fix/veemon-rendering

name: Materialize Veemon PNG

on:
  push:
    branches:
      - fix/veemon-rendering

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/veemon-rendering
          fetch-depth: 0
      - name: Decode and validate Veemon PNG
        shell: bash
        run: |
          set -euo pipefail
          base64 -d assets/characters/veemon.runtime.b64 > assets/characters/veemon.png
          python3 - <<'PY'
          import struct
          path = 'assets/characters/veemon.png'
          with open(path, 'rb') as handle:
              data = handle.read()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'invalid PNG signature'
          assert data[12:16] == b'IHDR', 'missing IHDR chunk'
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (384, 32), (width, height)
          print('Veemon PNG header validated: 384x32')
          PY
      - name: Commit materialized PNG
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/characters/veemon.png; then
            echo 'Veemon PNG already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/veemon.png
          git commit -m 'fix: materialize valid Veemon PNG'
          git push origin HEAD:fix/veemon-rendering

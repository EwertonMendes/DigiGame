name: Audit Garurumon-line generated DS sprites

on:
  push:
    branches:
      - feat/garurumon-line-ds-sprites

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Build visual direction contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw

          names = [
              'Garurumon', 'Were Garurumon', 'Metal Garurumon',
              'AncientGarurumon', 'Omnimon', 'JungleMojyamon'
          ]
          labels = ['DL', 'DR', 'UL', 'UR']
          scale = 4
          rows = []
          max_width = 0
          for name in names:
              key = ''.join(ch for ch in name.lower() if ch.isalnum())
              meta = json.loads((Path('assets/characters') / key / 'field.json').read_text())
              strip = Image.open(Path('assets/characters') / key / 'field.png').convert('RGBA')
              cw, ch = int(meta['cell_width']), int(meta['cell_height'])
              cells = [strip.crop((i*cw, 0, (i+1)*cw, ch)) for i in range(12)]
              frame_w, frame_h = cw*scale, ch*scale
              row_w = 180 + frame_w*12 + 4*12
              row_h = max(90, frame_h + 46)
              row = Image.new('RGBA', (row_w, row_h), (244,244,244,255))
              draw = ImageDraw.Draw(row)
              draw.text((8,8), name, fill=(0,0,0,255))
              draw.text((8,28), f"{meta['review_pattern']} / {meta['extraction_profile']}", fill=(40,40,40,255))
              x0 = 180
              for d in range(4):
                  draw.text((x0+d*(frame_w*3+12)+4, 4), labels[d], fill=(0,0,0,255))
                  for p in range(3):
                      idx = d*3+p
                      cell = cells[idx].resize((frame_w,frame_h), Image.Resampling.NEAREST)
                      x = x0 + d*(frame_w*3+12) + p*(frame_w+4)
                      row.alpha_composite(cell, (x, 26))
              rows.append(row)
              max_width = max(max_width, row_w)
          canvas = Image.new('RGBA', (max_width, sum(r.height for r in rows)), (230,230,230,255))
          y=0
          for row in rows:
              canvas.alpha_composite(row, (0,y)); y += row.height
          Path('audit_runtime').mkdir(exist_ok=True)
          canvas.convert('RGB').save('audit_runtime/garurumon-runtime-directions.png', quality=95)
          PY
      - name: Upload generated runtime direction audit
        uses: actions/upload-artifact@v4
        with:
          name: garurumon-runtime-audit
          path: audit_runtime/garurumon-runtime-directions.png
          if-no-files-found: error
          retention-days: 3

name: DigiGame Preview Health

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: digigame-preview-health-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-preview:
    name: Verify playable PR preview
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for current Pages preview
        shell: bash
        env:
          PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BUILD_URL="${PREVIEW_URL}preview-build.txt"

          for attempt in $(seq 1 60); do
            HTTP_CODE="$(curl -L -sS -o /tmp/preview-index.html -w '%{http_code}' "$PREVIEW_URL" || true)"
            BUILD_TEXT="$(curl -L -fsS "$BUILD_URL" 2>/dev/null || true)"

            if [ "$HTTP_CODE" = "200" ] && grep -Fq "Commit: ${HEAD_SHA}" <<<"$BUILD_TEXT"; then
              test -s /tmp/preview-index.html
              grep -qi '<html' /tmp/preview-index.html
              echo "Playable preview is reachable and matches ${HEAD_SHA}: ${PREVIEW_URL}"
              exit 0
            fi

            echo "Preview not ready/current yet (attempt ${attempt}/60, HTTP ${HTTP_CODE})."
            sleep 5
          done

          echo "Preview did not become reachable with the current PR commit: ${PREVIEW_URL}" >&2
          exit 1

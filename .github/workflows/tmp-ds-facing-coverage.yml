name: Temporary DS Facing Coverage

on:
  push:
    branches:
      - fix/ds-sprite-facing-audit

permissions:
  contents: write

jobs:
  coverage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify every directional runtime Digimon is audited
        shell: bash
        run: python3 tools/validate_all_ds_directional_facings.py

      - name: Commit coverage report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/ds-directional-resource-audit.json
          if git diff --cached --quiet; then
            echo 'Coverage report unchanged.'
            exit 0
          fi
          git commit -m 'test: audit every directional Digimon resource'
          git push origin HEAD:fix/ds-sprite-facing-audit

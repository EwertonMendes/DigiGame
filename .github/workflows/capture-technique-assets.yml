name: Materialize technique VFX and audio assets

on:
  push:
    branches:
      - feat/technique-vfx-audio-library
    paths:
      - .github/workflows/capture-technique-assets.yml

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore verified capture artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/capture /tmp/digigame-assets
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10169506645/zip" \
            -o /tmp/technique-assets-capture.zip
          echo 'a936a3b3be520fb301620a7080cb71627210c5e5935aa251183fb2d4f8768dce  /tmp/technique-assets-capture.zip' | sha256sum -c -
          unzip -q /tmp/technique-assets-capture.zip -d /tmp/capture

          cp /tmp/capture/zips/pixelart_spells.zip /tmp/digigame-assets/pixel-art-spells.zip
          cp /tmp/capture/zips/foozle_pixel_magic.zip /tmp/digigame-assets/foozle-pixel-magic.zip
          cp /tmp/capture/zips/pvfx_foundry.zip /tmp/digigame-assets/pvfx-foundry-0.7.0.zip
          cp /tmp/capture/zips/nature_magic.zip /tmp/digigame-assets/nature-magic.zip
          cp /tmp/capture/zips/digimon_world_ds_sfx.zip /tmp/digigame-assets/digimon-world-ds-sfx.zip

          cat > /tmp/digigame-assets/SHA256SUMS <<'SUMS'
          bf6e751559942aad40a50359ab5ae8f9750054546de0b21b4519d39904e163cb  pixel-art-spells.zip
          46f44a30d38b65d55ed1101ce8dc8907e31043958abaf9e2b1894508438815f8  nature-magic.zip
          0c04ab8ee856988b55885a92305d5382459cc855b2a6361c417bb11606f41e9a  foozle-pixel-magic.zip
          a2a26a2c162ff9d58037c921d6c568d7fa944cfb166e25eef68f908046c29add  pvfx-foundry-0.7.0.zip
          990d8d9417351d154c8e35a014775419a9788e2c53c964b220703765e80d1ba4  digimon-world-ds-sfx.zip
          SUMS
          (cd /tmp/digigame-assets && sha256sum -c SHA256SUMS)

      - name: Vendor sources and build runtime atlases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/vfx-source assets/audio/digimon-world-ds /tmp/digimon-sfx
          cp /tmp/digigame-assets/pixel-art-spells.zip vendor/vfx-source/pixel-art-spells.zip
          cp /tmp/digigame-assets/foozle-pixel-magic.zip vendor/vfx-source/foozle-pixel-magic.zip
          cp /tmp/digigame-assets/pvfx-foundry-0.7.0.zip vendor/vfx-source/pvfx-foundry-0.7.0.zip
          cp /tmp/digigame-assets/nature-magic.zip vendor/vfx-source/nature-magic.zip

          unzip -q /tmp/digigame-assets/digimon-world-ds-sfx.zip -d /tmp/digimon-sfx
          cp '/tmp/digimon-sfx/Digimon World DS/053.wav' assets/audio/digimon-world-ds/normal-attack-whoosh.wav
          cp '/tmp/digimon-sfx/Digimon World DS/031.wav' assets/audio/digimon-world-ds/normal-attack-impact.wav
          cp '/tmp/digimon-sfx/Digimon World DS/043.wav' assets/audio/digimon-world-ds/technique-cast.wav
          cp '/tmp/digimon-sfx/Digimon World DS/068.wav' assets/audio/digimon-world-ds/technique-impact.wav

          python3 -m pip install --disable-pip-version-check Pillow==12.3.0
          python3 tools/build_vfx_library.py
          test "$(python3 - <<'PY'
          import json
          print(len(json.load(open('database/vfx-library.json'))['effects']))
          PY
          )" = '71'

      - name: Commit materialized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DigiGame Asset Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add vendor/vfx-source assets/vfx/library/atlas assets/audio/digimon-world-ds database/vfx-library.json
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'chore: vendor technique VFX and battle SFX'
          git push origin HEAD:feat/technique-vfx-audio-library

name: Capture technique VFX and audio assets

on:
  push:
    branches:
      - feat/technique-vfx-audio-library
    paths:
      - .github/workflows/capture-technique-assets.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download pinned source archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digigame-assets

          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 DigiGame asset capture' \
            'https://opengameart.org/sites/default/files/pixelart_spells_1.zip' \
            -o /tmp/digigame-assets/pixel-art-spells.zip
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 DigiGame asset capture' \
            'https://opengameart.org/sites/default/files/Nature%20Magic%20Effect.zip' \
            -o /tmp/digigame-assets/nature-magic.zip

          python3 - <<'PY'
          import base64
          import json
          import re
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          import requests

          OUT = Path('/tmp/digigame-assets')
          UA = 'Mozilla/5.0 (X11; Linux x86_64) DigiGame/asset-capture'

          def csrf_from(html: str) -> str:
              for pattern in (
                  r'<meta[^>]+name=["\']csrf_token["\'][^>]+value=["\']([^"\']+)',
                  r'<meta[^>]+value=["\']([^"\']+)["\'][^>]+name=["\']csrf_token["\']',
                  r'<input[^>]+name=["\']csrf_token["\'][^>]+value=["\']([^"\']+)',
                  r'<input[^>]+value=["\']([^"\']+)["\'][^>]+name=["\']csrf_token["\']',
              ):
                  match = re.search(pattern, html, flags=re.I)
                  if match:
                      return match.group(1)
              raise RuntimeError('itch.io CSRF token not found')

          def download_free_itch(game_url: str, expected_filename: str, output: Path) -> None:
              session = requests.Session()
              session.headers.update({'User-Agent': UA})
              page = session.get(game_url, timeout=30)
              page.raise_for_status()
              signed = session.post(
                  game_url.rstrip('/') + '/download_url',
                  data={'csrf_token': csrf_from(page.text), 'suggested_amount': '0'},
                  headers={'Referer': game_url}, timeout=30,
              )
              signed.raise_for_status()
              signed_url = signed.json().get('url', '')
              if not signed_url:
                  raise RuntimeError(f'no free download URL for {game_url}')
              token = unquote(urlparse(signed_url).path.rsplit('/', 1)[-1])
              payload = token.split('.', 1)[0]
              payload += '=' * (-len(payload) % 4)
              download_key_id = int(json.loads(base64.b64decode(payload).decode('utf-8'))['id'])
              signed_page = session.get(signed_url, timeout=30)
              signed_page.raise_for_status()
              signed_csrf = csrf_from(signed_page.text)
              upload_id = None
              for match in re.finditer(r'data-upload_id=["\'](\d+)["\']', signed_page.text, flags=re.I):
                  window = signed_page.text[max(0, match.start() - 1800):min(len(signed_page.text), match.end() + 1800)]
                  if expected_filename.lower() in window.lower():
                      upload_id = match.group(1)
                      break
              if upload_id is None:
                  ids = re.findall(r'data-upload_id=["\'](\d+)["\']', signed_page.text, flags=re.I)
                  if len(ids) != 1:
                      raise RuntimeError(f'could not resolve {expected_filename}; upload ids={ids}')
                  upload_id = ids[0]
              resolver = session.post(
                  game_url.rstrip('/') + f'/file/{upload_id}',
                  data={'csrf_token': signed_csrf, 'download_key_id': str(download_key_id)},
                  headers={'Referer': signed_url}, timeout=30,
              )
              resolver.raise_for_status()
              cdn_url = resolver.json().get('url', '')
              if not cdn_url:
                  raise RuntimeError(f'no CDN URL returned for {expected_filename}')
              with session.get(cdn_url, stream=True, timeout=60) as download:
                  download.raise_for_status()
                  with output.open('wb') as handle:
                      for chunk in download.iter_content(256 * 1024):
                          if chunk:
                              handle.write(chunk)

          download_free_itch(
              'https://foozlecc.itch.io/pixel-magic-sprite-effects',
              'Foozle_2DE0001_Pixel_Magic_Effects.zip',
              OUT / 'foozle-pixel-magic.zip',
          )
          download_free_itch(
              'https://nerijs.itch.io/pvfx-foundry',
              'PVFX-Foundry-0.7.0.zip',
              OUT / 'pvfx-foundry-0.7.0.zip',
          )
          PY

          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 DigiGame asset capture' \
            'https://sounds.spriters-resource.com/media/assets/397/400142.zip?updated=1755530283' \
            -o /tmp/digigame-assets/digimon-world-ds-sfx.zip

          cat > /tmp/digigame-assets/SHA256SUMS <<'SUMS'
          bf6e751559942aad40a50359ab5ae8f9750054546de0b21b4519d39904e163cb  pixel-art-spells.zip
          46f44a30d38b65d55ed1101ce8dc8907e31043958abaf9e2b1894508438815f8  nature-magic.zip
          0c04ab8ee856988b55885a92305d5382459cc855b2a6361c417bb11606f41e9a  foozle-pixel-magic.zip
          a2a26a2c162ff9d58037c921d6c568d7fa944cfb166e25eef68f908046c29add  pvfx-foundry-0.7.0.zip
          990d8d9417351d154c8e35a014775419a9788e2c53c964b220703765e80d1ba4  digimon-world-ds-sfx.zip
          SUMS
          (cd /tmp/digigame-assets && sha256sum -c SHA256SUMS)

      - name: Vendor sources and build runtime atlases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/vfx-source assets/audio/digimon-world-ds /tmp/digimon-sfx
          cp /tmp/digigame-assets/pixel-art-spells.zip vendor/vfx-source/pixel-art-spells.zip
          cp /tmp/digigame-assets/foozle-pixel-magic.zip vendor/vfx-source/foozle-pixel-magic.zip
          cp /tmp/digigame-assets/pvfx-foundry-0.7.0.zip vendor/vfx-source/pvfx-foundry-0.7.0.zip
          cp /tmp/digigame-assets/nature-magic.zip vendor/vfx-source/nature-magic.zip

          unzip -q /tmp/digigame-assets/digimon-world-ds-sfx.zip -d /tmp/digimon-sfx
          cp '/tmp/digimon-sfx/Digimon World DS/053.wav' assets/audio/digimon-world-ds/normal-attack-whoosh.wav
          cp '/tmp/digimon-sfx/Digimon World DS/031.wav' assets/audio/digimon-world-ds/normal-attack-impact.wav
          cp '/tmp/digimon-sfx/Digimon World DS/043.wav' assets/audio/digimon-world-ds/technique-cast.wav
          cp '/tmp/digimon-sfx/Digimon World DS/068.wav' assets/audio/digimon-world-ds/technique-impact.wav

          python3 -m pip install --disable-pip-version-check Pillow==12.3.0
          python3 tools/build_vfx_library.py

          test "$(python3 - <<'PY'
          import json
          print(len(json.load(open('database/vfx-library.json'))['effects']))
          PY
          )" = '71'

      - name: Commit materialized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DigiGame Asset Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add vendor/vfx-source assets/vfx/library/atlas assets/audio/digimon-world-ds database/vfx-library.json
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'chore: vendor technique VFX and battle SFX'
          git push origin HEAD:feat/technique-vfx-audio-library

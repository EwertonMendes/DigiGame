name: Materialize requested DS batch

on:
  push:
    branches:
      - feat/digimon-batch-2

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[skip ds-batch-materialize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install sprite tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Build all audited additional DS playables
        run: python3 tools/build_additional_ds_fields.py
      - name: Validate generated contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_additional_ds_fields.py
          python3 tools/validate_all_ds_directional_facings.py
          python3 tools/validate_digimon_progression.py
          python3 tools/enrich_digimon_database.py --check
      - name: Commit generated runtime assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'DS batch is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: materialize requested DS Digimon batch [skip ds-batch-materialize] [skip ds-batch-inspect]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: MetalGreymon source probe

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  fetch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch MetalGreymon source sheet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          curl -fL --retry 3 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            'https://www.spriters-resource.com/media/assets/45/48322.png' \
            -o probe/metalgreymon-source.png
          file probe/metalgreymon-source.png
          sha256sum probe/metalgreymon-source.png | tee probe/sha256.txt
          python3 - <<'PY'
          import struct
          from pathlib import Path
          data = Path('probe/metalgreymon-source.png').read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Downloaded file is not a PNG')
          width, height = struct.unpack('>II', data[16:24])
          print(f'PNG dimensions: {width}x{height}')
          if (width, height) != (395, 432):
              raise SystemExit(f'Unexpected source dimensions: {width}x{height}')
          PY

      - name: Upload source probe
        uses: actions/upload-artifact@v4
        with:
          name: metalgreymon-source-probe
          path: probe/
          if-no-files-found: error

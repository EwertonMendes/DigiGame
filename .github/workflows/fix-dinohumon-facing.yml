name: Fix Dinohumon rear facing

on:
  push:
    branches:
      - fix/ds-sprite-agumon-line-veemon-batch
    paths:
      - '.github/workflows/fix-dinohumon-facing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Correct Dinohumon rear direction mapping
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('database/ds-additional-sources.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          dino = data['species']['Dinohumon']
          assert dino['pattern'] == 'canonical_rows', dino
          dino['pattern'] = 'canonical_rows_rear_reversed'
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Install sprite tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy scipy

      - name: Regenerate directional runtime assets
        run: python3 tools/build_additional_ds_fields.py

      - name: Validate generated assets
        run: |
          python3 tools/validate_additional_ds_fields.py
          python3 tools/validate_all_ds_directional_facings.py

      - name: Commit corrected Dinohumon assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            database/ds-additional-sources.json \
            database/additional-ds-playables.json \
            database/ds-directional-resource-audit.json \
            assets/characters/dinohumon \
            assets/resources/dinohumon.tres
          if git diff --cached --quiet; then
            echo 'No Dinohumon-facing changes were generated.' >&2
            exit 1
          fi
          git commit -m 'fix: correct Dinohumon rear facing [skip additional-ds-rebuild]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Materialize Zeke integration fix outputs

on:
  push:
    branches:
      - fix/zeke-greymon-battle-integration

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[skip zeke-rebuild]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install sprite tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy

      - name: Rebuild normalized project-supplied sprites
        run: |
          python3 tools/materialize_project_supplied_sources.py
          python3 tools/build_project_supplied_directional.py
          python3 tools/validate_project_supplied_directional.py
          python3 tools/validate_all_ds_directional_facings.py

      - name: Rebuild and curate combat techniques
        run: |
          node tools/build_technique_catalog.mjs
          python3 tools/apply_technique_curation.py
          python3 tools/validate_combat_data.py

      - name: Commit generated outputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo 'Generated outputs already match.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/characters \
            assets/resources \
            database/project-supplied-playables.json \
            database/ds-directional-resource-audit.json \
            database/techniques.json \
            database/digimon-learnsets.json \
            database/technique-records.json \
            database/technique-source-audit.json \
            database/technique-matrix.csv
          git commit -m 'chore: materialize Zeke integration outputs [skip zeke-rebuild]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: DigiGame Web

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: digigame-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build-web:
    name: Fast Web gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore external city asset cache
        uses: actions/cache@v4
        with:
          path: .cache/external-city-assets
          key: external-city-assets-v1-dystopian-future

      - name: Stage optimized external Central City assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet "Pillow==11.3.0"
          bash tools/setup_external_city_assets.sh
          python3 tools/validate_external_city_assets.py

      - name: Validate app branding configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_app_icon.py

      - name: Validate vendored runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_runtime_assets.py

      - name: Restore Godot Web toolchain cache
        id: godot-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/digigame-godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-web-toolchain-v2-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot Web toolchain on cache miss
        if: steps.godot-toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-stable"
          mkdir -p "$HOME/.cache/digigame-godot"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_TAG}_linux.x86_64" "$HOME/.cache/digigame-godot/godot"
          chmod +x "$HOME/.cache/digigame-godot/godot"

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz" -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates && mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz 'templates/web*.zip' 'templates/version.txt' -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Activate Godot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$HOME/.cache/digigame-godot/godot"
          sudo ln -sf "$HOME/.cache/digigame-godot/godot" /usr/local/bin/godot
          godot --version

      - name: Restore Godot imported-resource cache
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.gd', '**/*.tscn', '**/*.tres', 'assets/**/*') }}
          restore-keys: |
            godot-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERR_FILE_CORRUPT|Error loading image:|Error importing .*assets/characters' /tmp/godot-import.log; then exit 1; fi

      - name: Validate game data
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/enrich_digimon_database.py --check
          python3 tools/validate_combat_data.py
          python3 tools/validate_digimon_progression.py
          python3 tools/validate_early_rank_playables.py

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/godot-export.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERR_FILE_CORRUPT|Error loading image:|Error importing ' /tmp/godot-export.log; then exit 1; fi
          test -s build/web/index.html && test -s build/web/index.wasm

      - name: Upload Web build once
        uses: actions/upload-artifact@v4
        with:
          name: digigame-web-build
          path: build/web
          if-no-files-found: error
          retention-days: 30

      - name: Start Post-Web QA after successful build
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/master')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_TESTED_SHA: ${{ github.sha }}
          SOURCE_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          POST_WEB_REF="master"
          if [[ "$SOURCE_EVENT" == "pull_request" && "$SOURCE_HEAD_REPO" == "$GITHUB_REPOSITORY" ]]; then
            POST_WEB_REF="$SOURCE_HEAD_BRANCH"
          fi

          for attempt in 1 2 3; do
            if gh workflow run post-web.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$POST_WEB_REF" \
              -f source_run_id="$GITHUB_RUN_ID" \
              -f source_event="$SOURCE_EVENT" \
              -f source_head_branch="$SOURCE_HEAD_BRANCH" \
              -f source_head_sha="$SOURCE_HEAD_SHA" \
              -f tested_sha="$SOURCE_TESTED_SHA" \
              -f source_head_repo="$SOURCE_HEAD_REPO" \
              -f pr_number="$PR_NUMBER"; then
              echo "Post-Web QA dispatched for Web run ${GITHUB_RUN_ID}."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done

          echo "Failed to dispatch Post-Web QA after 3 attempts." >&2
          exit 1

name: DigiGame Web

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digigame-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  build-web:
    name: Validate and build Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch preferred UI fonts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fetch_ui_fonts.py

      - name: Validate vendored runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_runtime_assets.py

      - name: Restore Godot Web toolchain cache
        id: godot-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/digigame-godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-web-toolchain-v2-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot Web toolchain on cache miss
        if: steps.godot-toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-stable"
          mkdir -p "$HOME/.cache/digigame-godot"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_TAG}_linux.x86_64" "$HOME/.cache/digigame-godot/godot"
          chmod +x "$HOME/.cache/digigame-godot/godot"

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz" -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates && mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz 'templates/web*.zip' 'templates/version.txt' -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Activate Godot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$HOME/.cache/digigame-godot/godot"
          sudo ln -sf "$HOME/.cache/digigame-godot/godot" /usr/local/bin/godot
          godot --version

      - name: Restore Godot imported-resource cache
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.gd', '**/*.tscn', '**/*.tres', 'assets/**/*') }}
          restore-keys: |
            godot-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERR_FILE_CORRUPT|Error loading image:|Error importing .*assets/characters' /tmp/godot-import.log; then exit 1; fi

      - name: Run headless gameplay regressions
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . tools/test_tile_based_selection.tscn --quit-after 5 2>&1 | tee /tmp/tile-selection.log
          grep -q 'tile-based Digimon selection regression passed' /tmp/tile-selection.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/tile-selection.log; then exit 1; fi

          godot --headless --path . tools/test_isometric_keyboard_navigation.tscn --quit-after 5 2>&1 | tee /tmp/isometric-keyboard.log
          grep -q 'isometric keyboard navigation regression passed' /tmp/isometric-keyboard.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/isometric-keyboard.log; then exit 1; fi

          godot --headless --path . tools/test_attack_patterns.tscn --quit-after 5 2>&1 | tee /tmp/attack-patterns.log
          grep -q 'advanced attack pattern regression passed' /tmp/attack-patterns.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' /tmp/attack-patterns.log; then exit 1; fi

          godot --headless --path . tools/test_hub_foundation.tscn --quit-after 8 2>&1 | tee /tmp/hub-foundation.log
          grep -q 'hub foundation regression passed' /tmp/hub-foundation.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/hub-foundation.log; then exit 1; fi

          godot --headless --path . tools/test_digimon_progression.tscn --quit-after 8 2>&1 | tee /tmp/digimon-progression.log
          grep -q 'digimon progression regression passed' /tmp/digimon-progression.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' /tmp/digimon-progression.log; then exit 1; fi

      - name: Run early-rank playable battle regression
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . tools/test_early_rank_playables.tscn --quit-after 240 2>&1 | tee /tmp/early-rank-playables.log
          grep -q 'early-rank playable battle regression passed' /tmp/early-rank-playables.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' /tmp/early-rank-playables.log; then exit 1; fi

      - name: Validate game data
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/enrich_digimon_database.py --check
          python3 tools/validate_combat_data.py
          python3 tools/validate_digimon_progression.py
          python3 tools/validate_early_rank_playables.py

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/godot-export.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERR_FILE_CORRUPT|Error loading image:|Error importing ' /tmp/godot-export.log; then exit 1; fi
          test -s build/web/index.html && test -s build/web/index.wasm

      - name: Upload Web build once
        uses: actions/upload-artifact@v4
        with:
          name: digigame-web-build
          path: build/web
          if-no-files-found: error
          retention-days: 7

      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/site/play build/site/media
          cp -a web/landing/. build/site/
          cp -a build/web/. build/site/play/
          cp docs/media/*.png build/site/media/
          touch build/site/.nojekyll
          test -s build/site/index.html
          test -s build/site/play/index.html
          test -s build/site/play/index.wasm

      - name: Upload Pages site
        uses: actions/upload-artifact@v4
        with:
          name: digigame-pages-site
          path: build/site
          if-no-files-found: error
          retention-days: 7

  landing-smoke:
    name: Landing page smoke
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v6

      - name: Download assembled Pages site
        uses: actions/download-artifact@v5
        with:
          name: digigame-pages-site
          path: build/site

      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Prepare Playwright
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts "playwright@${PLAYWRIGHT_VERSION}"
          test -x /usr/bin/google-chrome

      - name: Validate multilingual landing page
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory build/site >/tmp/digigame-landing-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node .github/scripts/landing-smoke.mjs

      - name: Upload landing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-landing
          path: build/landing-*.png
          if-no-files-found: warn
          retention-days: 7

  browser-smoke:
    name: Browser smoke · ${{ matrix.suite }}
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        suite:
          - desktop
          - combat
          - mobile
          - vfx
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v6

      - name: Download tested Web build
        uses: actions/download-artifact@v5
        with:
          name: digigame-web-build
          path: build/web

      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Prepare Playwright
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts "playwright@${PLAYWRIGHT_VERSION}"
          test -x /usr/bin/google-chrome

      - name: Run ${{ matrix.suite }} browser suite
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
          SMOKE_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory build/web >/tmp/digigame-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          if [ "$SMOKE_SUITE" = "vfx" ] || [ "$SMOKE_SUITE" = "combat" ]; then
            MAX_ATTEMPTS=5
            if [ "$SMOKE_SUITE" = "combat" ]; then
              MAX_ATTEMPTS=3
            fi
            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              echo "${SMOKE_SUITE} smoke attempt ${attempt}/${MAX_ATTEMPTS}"
              if node .github/scripts/browser-smoke.mjs; then
                exit 0
              fi
              if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
                echo "${SMOKE_SUITE} smoke failed after ${MAX_ATTEMPTS} independent browser runs." >&2
                exit 1
              fi
              echo "::warning::${SMOKE_SUITE} smoke hit a timing/randomized battle path; retrying with a fresh browser."
              sleep 1
            done
          else
            node .github/scripts/browser-smoke.mjs
          fi

      - name: Upload ${{ matrix.suite }} diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.suite }}
          path: build/*.png
          if-no-files-found: warn
          retention-days: 7

  deploy-pr-preview:
    name: Deploy PR preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - build-web
      - browser-smoke
      - landing-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
      pull-requests: write
    steps:
      - name: Download tested PR build
        uses: actions/download-artifact@v5
        with:
          name: digigame-pages-site
          path: preview

      - name: Restore production and add PR preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p site

          MASTER_RUN_ID="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow web.yml \
            --branch master \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [ -z "$MASTER_RUN_ID" ] || [ "$MASTER_RUN_ID" = "null" ]; then
            echo "No successful master Web workflow run was found; refusing to replace the production Pages root." >&2
            exit 1
          fi

          echo "Using master Web artifact from workflow run ${MASTER_RUN_ID}."
          if ! gh run download "$MASTER_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name digigame-pages-site \
            --dir site; then
            echo "Master predates the landing artifact; restoring the tested game at the production root."
            gh run download "$MASTER_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name digigame-web-build \
              --dir site
          fi

          PREVIEW_DIR="site/pr-${PR_NUMBER}"
          mkdir -p "$PREVIEW_DIR"
          cp -a preview/. "$PREVIEW_DIR/"

          cat > "$PREVIEW_DIR/preview-build.txt" <<EOF
          DigiGame pull request preview
          PR: #${PR_NUMBER}
          Commit: ${GITHUB_SHA}
          Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

          test -s site/index.html
          test -s "$PREVIEW_DIR/index.html"
          test -s "$PREVIEW_DIR/play/index.html"
          test -s "$PREVIEW_DIR/play/index.wasm"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish preview link on PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.pages.outputs.base_url }}/pr-${{ github.event.pull_request.number }}/
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MARKER='<!-- digigame-playable-preview -->'
          SHORT_SHA="${HEAD_SHA:0:7}"
          BODY="${MARKER}
          ## 🎮 Playable PR preview

          **[Open DigiGame PR #${PR_NUMBER} landing preview](${PREVIEW_URL})**

          Build: \`${SHORT_SHA}\` · validated by the landing, Web, desktop, mobile, combat and VFX jobs before deployment.

          This URL is the PR build; the normal Pages root remains the latest successful \`master\` build."

          COMMENT_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            | head -n 1)"

          if [ -n "$COMMENT_ID" ]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -f body="$BODY" >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY" >/dev/null
          fi

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - build-web
      - browser-smoke
      - landing-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download tested Web build
        uses: actions/download-artifact@v5
        with:
          name: digigame-pages-site
          path: artifact
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifact
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

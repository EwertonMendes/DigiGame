name: DigiGame Web

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  build-web:
    name: Build and browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fetch runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 tools/fetch_cc0_assets.py
          python3 tools/fetch_character_assets.py
          python3 tools/fetch_enemy_assets.py
          python3 tools/fetch_ui_fonts.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          for path in sorted(Path("assets/characters").rglob("*.png")):
              with Image.open(path) as image:
                  image.verify()
              print(f"validated PNG: {path}")

          for path in sorted(Path("assets/characters").rglob("*.webp")):
              with Image.open(path) as image:
                  if getattr(image, "n_frames", 1) <= 1:
                      raise RuntimeError(f"expected animated WebP: {path}")
              print(f"validated animated WebP: {path}")

          for path in [
              Path("assets/ui/fonts/Rajdhani-Regular.ttf"),
              Path("assets/ui/fonts/Rajdhani-SemiBold.ttf"),
          ]:
              if not path.is_file() or path.stat().st_size < 1024:
                  raise RuntimeError(f"missing UI font: {path}")
              print(f"validated UI font: {path} ({path.stat().st_size} bytes)")
          PY
      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-stable"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_TAG}_linux.x86_64"
          sudo mv "/tmp/godot/Godot_v${GODOT_TAG}_linux.x86_64" /usr/local/bin/godot
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz" -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates && mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version
      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERR_FILE_CORRUPT|Error loading image:|Error importing .*assets/characters' /tmp/godot-import.log; then exit 1; fi
      - name: Validate combat presentation runtime
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script tools/combat_presentation_smoke.gd 2>&1 | tee /tmp/combat-presentation.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Combat presentation smoke failed:' /tmp/combat-presentation.log; then exit 1; fi
          grep -F 'Combat presentation smoke passed:' /tmp/combat-presentation.log
      - name: Validate Digimon species database
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/enrich_digimon_database.py --check
      - name: Validate combat data
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_combat_data.py
      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/godot-export.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERR_FILE_CORRUPT|Error loading image:|Error importing ' /tmp/godot-export.log; then exit 1; fi
          test -s build/web/index.html && test -s build/web/index.wasm
      - name: Prepare browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          google-chrome --version
      - name: Run Web build in Chrome
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory build/web >/tmp/digigame-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node .github/scripts/web-smoke-test.mjs
      - name: Upload playable Web artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digigame-web
          path: |
            build/web
            build/*.png
            assets/characters/**/*.png
            assets/characters/**/*.webp
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download tested Web build
        uses: actions/download-artifact@v5
        with:
          name: digigame-web
          path: artifact
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifact/build/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

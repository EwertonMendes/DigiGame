name: DigiGame Web

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digigame-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  build-web:
    name: Fast Web gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch preferred UI fonts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fetch_ui_fonts.py

      - name: Validate vendored runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_runtime_assets.py

      - name: Restore Godot Web toolchain cache
        id: godot-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/digigame-godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-web-toolchain-v2-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot Web toolchain on cache miss
        if: steps.godot-toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-stable"
          mkdir -p "$HOME/.cache/digigame-godot"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_TAG}_linux.x86_64" "$HOME/.cache/digigame-godot/godot"
          chmod +x "$HOME/.cache/digigame-godot/godot"

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz" -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates && mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz 'templates/web*.zip' 'templates/version.txt' -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Activate Godot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$HOME/.cache/digigame-godot/godot"
          sudo ln -sf "$HOME/.cache/digigame-godot/godot" /usr/local/bin/godot
          godot --version

      - name: Restore Godot imported-resource cache
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', '**/*.gd', '**/*.tscn', '**/*.tres', 'assets/**/*') }}
          restore-keys: |
            godot-imported-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERR_FILE_CORRUPT|Error loading image:|Error importing .*assets/characters' /tmp/godot-import.log; then exit 1; fi

      - name: Validate game data
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/enrich_digimon_database.py --check
          python3 tools/validate_combat_data.py
          python3 tools/validate_digimon_progression.py
          python3 tools/validate_early_rank_playables.py

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/godot-export.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERR_FILE_CORRUPT|Error loading image:|Error importing ' /tmp/godot-export.log; then exit 1; fi
          test -s build/web/index.html && test -s build/web/index.wasm

      - name: Upload Web build once
        uses: actions/upload-artifact@v4
        with:
          name: digigame-web-build
          path: build/web
          if-no-files-found: error
          retention-days: 30

  browser-smoke:
    name: Browser regression · ${{ matrix.suite }}
    needs:
      - build-web
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite:
          - desktop
          - combat-vfx
          - mobile
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download tested Web build
        uses: actions/download-artifact@v5
        with:
          name: digigame-web-build
          path: build/web

      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Prepare Playwright
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts "playwright@${PLAYWRIGHT_VERSION}"
          test -x /usr/bin/google-chrome

      - name: Run ${{ matrix.suite }} browser suite
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
          SMOKE_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory build/web >/tmp/digigame-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node .github/scripts/browser-smoke.mjs

      - name: Upload ${{ matrix.suite }} failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.suite }}-${{ github.run_id }}
          path: build/*.png
          if-no-files-found: warn
          retention-days: 7

  deploy-pr-preview:
    name: Deploy PR preview
    needs:
      - build-web
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: digigame-pages-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download tested PR build
        uses: actions/download-artifact@v5
        with:
          name: digigame-web-build
          path: preview

      - name: Download latest successful master build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MASTER_RUN_ID="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow web.yml \
            --branch master \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [ -z "$MASTER_RUN_ID" ] || [ "$MASTER_RUN_ID" = "null" ]; then
            echo "No successful master Web workflow run was found; refusing to replace the production Pages root." >&2
            exit 1
          fi

          gh run download "$MASTER_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name digigame-web-build \
            --dir production

      - name: Compose production and all open PR previews
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          bash .github/scripts/compose-pages-site.sh site production preview "$PR_NUMBER"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish preview link on PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.pages.outputs.base_url }}/pr-${{ github.event.pull_request.number }}/
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MARKER='<!-- digigame-playable-preview -->'
          SHORT_SHA="${HEAD_SHA:0:7}"
          BODY="${MARKER}
          ## 🎮 Playable PR preview

          **[Open DigiGame PR #${PR_NUMBER}](${PREVIEW_URL})**

          Build: \`${SHORT_SHA}\` · produced by the fast Web gate. Browser regressions run in parallel after the gate; on PRs they are diagnostic, while master still requires them before production Pages deploys.

          Other open PR previews are preserved in the same Pages deployment."

          COMMENT_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            | head -n 1)"

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -f body="$BODY" >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY" >/dev/null
          fi

  deploy-pages:
    name: Deploy GitHub Pages
    needs:
      - build-web
      - browser-smoke
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: digigame-pages-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download tested Web build
        uses: actions/download-artifact@v5
        with:
          name: digigame-web-build
          path: production

      - name: Compose production and all open PR previews
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/compose-pages-site.sh site production

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

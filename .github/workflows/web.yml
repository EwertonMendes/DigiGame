name: DigiGame Web

on:
  push:
    branches:
      - master
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  build-web:
    name: Build and browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch pinned CC0 assets
        run: python3 tools/fetch_cc0_assets.py

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-stable"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_TAG}_linux.x86_64"
          sudo mv "/tmp/godot/Godot_v${GODOT_TAG}_linux.x86_64" /usr/local/bin/godot

          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz" -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

          godot --version

      - name: Import and validate project
        run: godot --headless --path . --import

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm

      - name: Install browser for smoke test
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Web build in Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory build/web >/tmp/digigame-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node .github/scripts/web-smoke-test.mjs

      - name: Upload playable Web artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digigame-web
          path: |
            build/web
            build/web-smoke.png
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download tested Web build
        uses: actions/download-artifact@v5
        with:
          name: digigame-web
          path: artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifact/web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Inspect DS source layouts

on:
  push:
    branches:
      - fix/ds-sprite-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Audit requested higher-rank sheets
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/netraular/DigimonWorldSpriteManager.git /tmp/digimon-sprite-manager
          PYTHONPATH=tools python3 tools/audit_requested_ds_sources.py | tee /tmp/requested-ds-source-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: requested-ds-source-audit
          path: |
            /tmp/requested-ds-source-audit.json
            /tmp/requested-ds-raw
          retention-days: 3

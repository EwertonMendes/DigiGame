name: Inspect DS source layouts

on:
  push:
    branches:
      - fix/ds-sprite-facing-audit

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip ds-inspect]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Extract original WtW DS source sheets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from tools.build_early_rank_ds_fields import load_wtw_archive
          wanted = {1, 25, 60, 80, 2, 5, 28}
          out = Path('/tmp/ds-source-layouts')
          out.mkdir(parents=True, exist_ok=True)
          archive = load_wtw_archive()
          for name in archive.namelist():
              if not name.startswith('sprite thread/'):
                  continue
              base = Path(name).name
              try:
                  sprite_id = int(base.split('_', 1)[0])
              except ValueError:
                  continue
              if sprite_id in wanted and base.lower().endswith(('.png', '.gif')):
                  (out / base).write_bytes(archive.read(name))
                  print(base)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ds-source-layouts
          path: /tmp/ds-source-layouts
          retention-days: 1

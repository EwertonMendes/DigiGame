name: Inspect DS source layouts

on:
  push:
    branches:
      - fix/ds-sprite-facing-audit

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip ds-inspect]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Export every raw WtW source used by the registry
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 - <<'PY'
          import json
          from pathlib import Path
          from build_early_rank_ds_fields import load_wtw_archive

          registry = json.loads(Path('database/ds-direction-registry.json').read_text())
          out = Path('/tmp/ds-exact-source-audit/raw')
          out.mkdir(parents=True, exist_ok=True)
          archive = load_wtw_archive()
          exported = []
          for name, entry in sorted(registry['species'].items(), key=lambda item: int(item[1]['source_id'])):
              member = entry['source_member']
              data = archive.read(member)
              suffix = Path(member).suffix.lower() or '.png'
              filename = f"{int(entry['source_id']):03d}_{name.replace('/', '_')}{suffix}"
              (out / filename).write_bytes(data)
              exported.append({'name': name, 'source_id': entry['source_id'], 'member': member, 'file': filename})
          Path('/tmp/ds-exact-source-audit/manifest.json').write_text(json.dumps(exported, indent=2) + '\n')
          assert len(exported) == 82
          print('exported 82/82 raw WtW sources')
          PY
      - name: Export public SpriteManager semantic specs for cross-checking
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/netraular/DigimonWorldSpriteManager.git /tmp/digimon-sprite-manager
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/digimon-sprite-manager/specs/digimon')
          specs = {}
          for path in sorted(root.glob('*.extract.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              name = str(data.get('creature_name', '')).strip()
              if not name:
                  continue
              specs.setdefault(name, []).append({
                  'spec_file': path.name,
                  'id': data.get('id'),
                  'source': data.get('source'),
                  'clips': data.get('clips', {}),
                  'mirror': data.get('mirror', {}),
                  'anchor': data.get('anchor'),
                  'walk_style': data.get('walk_style'),
                  'boxes': data.get('boxes', []),
              })
          out = Path('/tmp/ds-exact-source-audit/manager-specs.json')
          out.write_text(json.dumps(specs, indent=2) + '\n', encoding='utf-8')
          print(f'exported semantic specs for {len(specs)} named SpriteManager entries')
          PY
      - name: Render all final DS runtime direction strips
        run: python3 tools/render_generated_ds_direction_audit.py
      - name: Copy final review sheets beside raw sources
        run: cp -r /tmp/ds-generated-direction-audit /tmp/ds-exact-source-audit/final
      - uses: actions/upload-artifact@v4
        with:
          name: ds-exact-source-audit
          path: /tmp/ds-exact-source-audit
          retention-days: 1

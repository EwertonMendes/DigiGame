name: Inspect DS source layouts

on:
  push:
    branches:
      - fix/ds-sprite-facing-audit

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip ds-inspect]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Render all final DS runtime direction strips
        run: python3 tools/render_generated_ds_direction_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: ds-final-generated-direction-audit
          path: /tmp/ds-generated-direction-audit
          retention-days: 1

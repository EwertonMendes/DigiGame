name: Enrich Digimon Database

on:
  push:
    branches:
      - feat/digimon-instance-progression
    paths:
      - tools/enrich_digimon_database.py
      - .github/workflows/enrich-digimon-database.yml

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/digimon-instance-progression
      - name: Add MOV and movement type to species database
        run: python3 tools/enrich_digimon_database.py
      - name: Commit enriched species metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- database/base-digimon-list.json; then
            echo "Database already enriched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/base-digimon-list.json
          git commit -m "data: add species movement metadata [skip enrich]"
          git push origin HEAD:feat/digimon-instance-progression

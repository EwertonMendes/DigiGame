name: Central City External Asset Probe

on:
  push:
    branches:
      - feat/central-city-asset-redesign
    paths:
      - '.github/workflows/city-asset-probe.yml'
      - 'tools/setup_external_city_assets.sh'
      - 'tools/probe_external_city_assets.py'
      - 'docs/external-city-assets.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Restore external asset download cache
        uses: actions/cache@v4
        with:
          path: .cache/external-city-assets
          key: external-city-assets-v1-dystopian-future

      - name: Stage licensed external city assets
        shell: bash
        run: |
          set -euo pipefail
          bash tools/setup_external_city_assets.sh

      - name: Generate asset inventory and contact sheets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet "Pillow==11.3.0"
          python3 tools/probe_external_city_assets.py
          cat build/city-asset-probe/dystopian-inventory.txt
          cat build/city-asset-probe/future-inventory.txt

      - name: Upload inspection-only contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: central-city-asset-probe
          path: build/city-asset-probe
          if-no-files-found: error
          retention-days: 2

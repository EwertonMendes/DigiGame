name: Rebuild project-supplied directional sprites

on:
  push:
    branches:
      - feat/zeke-greymon-normalized-sheet
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[skip project-supplied-rebuild]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install sprite tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy

      - name: Materialize pinned project-supplied sources
        run: python3 tools/materialize_project_supplied_sources.py

      - name: Build normalized project-supplied assets
        run: python3 tools/build_project_supplied_directional.py

      - name: Refactor remaining static portrait consumer
        run: python3 tools/refactor_animated_portrait_consumers.py

      - name: Validate normalized assets and source ownership
        run: |
          python3 tools/validate_project_supplied_directional.py
          python3 tools/validate_all_ds_directional_facings.py

      - name: Commit generated outputs when changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo 'Project-supplied rebuild is deterministic: committed outputs already match.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/characters \
            assets/resources \
            database/project-supplied-playables.json \
            database/ds-directional-resource-audit.json \
            src/BattleHUD.gd
          git commit -m 'refactor: animate battle HUD portraits through shared preview [skip project-supplied-rebuild]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: DigiGame Post-Web QA

on:
  workflow_run:
    workflows:
      - DigiGame Web
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: digigame-post-web-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  browser-smoke:
    name: Browser regression · ${{ matrix.suite }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        suite:
          - desktop
          - combat
          - mobile
          - vfx
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download tested Web build
        uses: actions/download-artifact@v5
        with:
          name: digigame-web-build
          path: build/web
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Prepare Playwright
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts "playwright@${PLAYWRIGHT_VERSION}"
          test -x /usr/bin/google-chrome

      - name: Run ${{ matrix.suite }} browser suite
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
          SMOKE_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory build/web >/tmp/digigame-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          # The battle intro is animation/tween driven and software-rendered
          # Chromium runners occasionally miss the presentation deadline even
          # though the exact same artifact succeeds on a fresh runner. Keep all
          # assertions mandatory and retry only suites that exercise that path.
          if [ "$SMOKE_SUITE" = "vfx" ] || [ "$SMOKE_SUITE" = "combat" ] || [ "$SMOKE_SUITE" = "mobile" ]; then
            MAX_ATTEMPTS=5
            if [ "$SMOKE_SUITE" = "combat" ] || [ "$SMOKE_SUITE" = "mobile" ]; then
              MAX_ATTEMPTS=3
            fi
            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              echo "${SMOKE_SUITE} smoke attempt ${attempt}/${MAX_ATTEMPTS}"
              if node .github/scripts/browser-smoke.mjs; then
                exit 0
              fi
              if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
                echo "${SMOKE_SUITE} smoke failed after ${MAX_ATTEMPTS} independent browser runs." >&2
                exit 1
              fi
              echo "::warning::${SMOKE_SUITE} smoke hit a timing/randomized battle path; retrying with a fresh browser."
              sleep 1
            done
          else
            node .github/scripts/browser-smoke.mjs
          fi

      - name: Upload ${{ matrix.suite }} diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.suite }}-${{ github.event.workflow_run.id }}
          path: build/*.png
          if-no-files-found: warn
          retention-days: 7

  deploy-pr-preview:
    name: Deploy PR preview
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: digigame-pages-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve pull request number
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$HEAD_BRANCH" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number')"
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "Could not resolve the open PR for branch ${HEAD_BRANCH}." >&2
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Download tested PR build
        uses: actions/download-artifact@v5
        with:
          name: digigame-web-build
          path: preview
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download latest successful master build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MASTER_RUN_ID="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow web.yml \
            --branch master \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [ -z "$MASTER_RUN_ID" ] || [ "$MASTER_RUN_ID" = "null" ]; then
            echo "No successful master Web workflow run was found; refusing to replace the production Pages root." >&2
            exit 1
          fi

          gh run download "$MASTER_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name digigame-web-build \
            --dir production

      - name: Compose production and all open PR previews
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_PREVIEW_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          bash .github/scripts/compose-pages-site.sh site production preview "$PR_NUMBER"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published preview
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.pages.outputs.base_url }}/pr-${{ steps.pr.outputs.number }}/
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          BUILD_URL="${PREVIEW_URL}preview-build.txt"
          for attempt in $(seq 1 18); do
            HTTP_CODE="$(curl -L -sS -o /tmp/preview-index.html -w '%{http_code}' "$PREVIEW_URL" || true)"
            BUILD_TEXT="$(curl -L -fsS "$BUILD_URL" 2>/dev/null || true)"
            if [ "$HTTP_CODE" = "200" ] && grep -Fq "Commit: ${HEAD_SHA}" <<<"$BUILD_TEXT"; then
              echo "Verified published preview ${PREVIEW_URL} for ${HEAD_SHA}."
              exit 0
            fi
            echo "Preview not current yet (attempt ${attempt}/18, HTTP ${HTTP_CODE}); waiting for Pages propagation..."
            sleep 5
          done
          echo "Published preview did not become reachable with the expected commit: ${PREVIEW_URL}" >&2
          exit 1

      - name: Publish preview link on PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_URL: ${{ steps.pages.outputs.base_url }}/pr-${{ steps.pr.outputs.number }}/
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          MARKER='<!-- digigame-playable-preview -->'
          SHORT_SHA="${HEAD_SHA:0:7}"
          BODY="${MARKER}
          ## 🎮 Playable PR preview

          **[Open DigiGame PR #${PR_NUMBER}](${PREVIEW_URL})**

          Build: \`${SHORT_SHA}\` · produced by the fast Web gate and verified reachable after Pages deployment. Browser regressions continue independently and remain visible as separate QA jobs.

          Other open PR previews are preserved in the same Pages deployment."

          COMMENT_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            | head -n 1)"

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -f body="$BODY" >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY" >/dev/null
          fi

  deploy-pages:
    name: Deploy GitHub Pages
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    needs:
      - browser-smoke
    runs-on: ubuntu-latest
    concurrency:
      group: digigame-pages-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download tested Web build
        uses: actions/download-artifact@v5
        with:
          name: digigame-web-build
          path: production
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Compose production and all open PR previews
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/compose-pages-site.sh site production

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production Pages
        shell: bash
        env:
          PAGE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            HTTP_CODE="$(curl -L -sS -o /tmp/production-index.html -w '%{http_code}' "$PAGE_URL" || true)"
            if [ "$HTTP_CODE" = "200" ] && grep -qi '<html' /tmp/production-index.html; then
              echo "Verified production Pages at ${PAGE_URL}."
              exit 0
            fi
            echo "Production Pages not ready yet (attempt ${attempt}/18, HTTP ${HTTP_CODE}); waiting..."
            sleep 5
          done
          echo "Production Pages did not become reachable after deployment: ${PAGE_URL}" >&2
          exit 1

name: DigiGame Post-Web QA

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Web workflow run ID that produced the tested artifact
        required: true
        type: string
      source_event:
        description: Source Web event (pull_request or push)
        required: true
        type: string
      source_head_branch:
        description: Source branch name
        required: true
        type: string
      source_head_sha:
        description: Source branch commit SHA used for preview identity
        required: true
        type: string
      tested_sha:
        description: Exact revision tested by the Web build
        required: true
        type: string
      source_head_repo:
        description: Source repository in owner/name form
        required: true
        type: string
      pr_number:
        description: Pull request number when source_event is pull_request
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: digigame-post-web-${{ inputs.source_run_id }}
  cancel-in-progress: false

env:
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  browser-smoke:
    name: Browser regression · ${{ matrix.suite }}
    if: >-
      inputs.source_event == 'pull_request' ||
      (inputs.source_event == 'push' && inputs.source_head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        suite:
          - desktop
          - combat-vfx
          - mobile
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tested_sha }}

      - name: Download tested Web build
        uses: actions/download-artifact@v5
        with:
          name: digigame-web-build
          path: build/web
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Prepare Playwright
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts "playwright@${PLAYWRIGHT_VERSION}"
          test -x /usr/bin/google-chrome

      - name: Run ${{ matrix.suite }} browser suite
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
          SMOKE_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory build/web >/tmp/digigame-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node .github/scripts/browser-smoke.mjs

      - name: Upload desktop visual snapshot
        if: matrix.suite == 'desktop'
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-${{ inputs.source_run_id }}
          path: |
            build/web-smoke.png
            build/desktop-*.png
            build/hub-battle-dialog.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload mobile visual snapshot
        if: matrix.suite == 'mobile'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-smoke-${{ inputs.source_run_id }}
          path: |
            build/hub-mobile-dialog.png
            build/mobile-*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload ${{ matrix.suite }} failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.suite }}-${{ inputs.source_run_id }}
          path: build/*.png
          if-no-files-found: warn
          retention-days: 7

  deploy-pr-preview:
    name: Deploy PR preview
    if: >-
      inputs.source_event == 'pull_request' &&
      inputs.source_head_repo == github.repository &&
      inputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: digigame-pages-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tested_sha }}

      - name: Resolve pull request number
        id: pr
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ]; then
            echo "Missing pull request number for dispatched PR preview." >&2
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Download tested PR build
        uses: actions/download-artifact@v5
        with:
          name: digigame-web-build
          path: preview
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Download latest successful master build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MASTER_RUN_ID="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow web.yml \
            --branch master \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [ -z "$MASTER_RUN_ID" ] || [ "$MASTER_RUN_ID" = "null" ]; then
            echo "No successful master Web workflow run was found; refusing to replace the production Pages root." >&2
            exit 1
          fi

          gh run download "$MASTER_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name digigame-web-build \
            --dir production

      - name: Compose production and all open PR previews
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_PREVIEW_SHA: ${{ inputs.source_head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          bash .github/scripts/compose-pages-site.sh site production preview "$PR_NUMBER"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish preview link on PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_URL: ${{ steps.pages.outputs.base_url }}/pr-${{ steps.pr.outputs.number }}/
          HEAD_SHA: ${{ inputs.source_head_sha }}
        run: |
          set -euo pipefail
          MARKER='<!-- digigame-playable-preview -->'
          SHORT_SHA="${HEAD_SHA:0:7}"
          BODY="${MARKER}
          ## 🎮 Playable PR preview

          **[Open DigiGame PR #${PR_NUMBER}](${PREVIEW_URL})**

          Build: \`${SHORT_SHA}\` · produced by the fast Web gate. Browser regressions continue independently and remain visible as separate QA jobs.

          Other open PR previews are preserved in the same Pages deployment."

          COMMENT_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            | head -n 1)"

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -f body="$BODY" >/dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY" >/dev/null
          fi

  deploy-pages:
    name: Deploy GitHub Pages
    if: >-
      inputs.source_event == 'push' &&
      inputs.source_head_branch == 'master'
    needs:
      - browser-smoke
    runs-on: ubuntu-latest
    concurrency:
      group: digigame-pages-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tested_sha }}

      - name: Download tested Web build
        uses: actions/download-artifact@v5
        with:
          name: digigame-web-build
          path: production
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Compose production and all open PR previews
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/compose-pages-site.sh site production

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

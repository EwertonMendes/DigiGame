name: Rebuild DS fields from audited exact coordinates

on:
  push:
    branches:
      - fix/ds-sprite-*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[skip ds-full-rebuild]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install sprite rebuild tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy scipy

      - name: Materialize exact coordinates from fresh original sources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/materialize_ds_direction_registry.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path('database/ds-direction-registry.json').read_text())
          review = json.loads(Path('database/ds-direction-review-map.json').read_text())

          assert registry['schema_version'] >= 4
          assert registry['species_count'] == 82
          assert registry['canonical_reference'] == 'Agumon'
          assert registry['canonical_runtime_order'] == ['down_left', 'down_right', 'up_left', 'up_right']
          assert registry['canonical_runtime_phases'] == ['idle', 'step_a', 'step_b']
          assert review['schema_version'] >= 4
          assert review['left_source_phase_order'] == [0, 1, 2]
          assert review['right_phase_policy'] == 'deterministic_mirror_pose_match'
          assert 'source_phase_overrides' not in review

          patterns = review['patterns']
          regressions = review['regression_cases']
          assert set(regressions.values()) == set(patterns)
          for name, pattern_name in regressions.items():
              assert registry['species'][name]['review_pattern'] == pattern_name
              assert registry['species'][name]['runtime_group_indices'] == patterns[pattern_name]

          for name, spec in registry['species'].items():
              assert spec['source_frame_order']['down_left'] == [0, 1, 2], name
              assert spec['source_frame_order']['up_left'] == [0, 1, 2], name
              for direction in ('down_right', 'up_right'):
                  alignment = spec['pose_alignment'][direction]
                  assert alignment['policy'] == 'deterministic_mirror_pose_match', (name, direction)
                  assert alignment['source_phase_order'] == spec['source_frame_order'][direction], (name, direction)

          print(
              f"exact direction registry materialized: 82/82 sources; "
              f"{len(patterns)}/{len(patterns)} source conventions covered"
          )
          PY

      - name: Hard-delete and rebuild from the exact registry
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rebuild_ds_fields_from_exact_registry.py

      - name: Verify exact registry-backed rebuild
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_ds_direction_registry.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('database/ds-full-rebuild-manifest.json').read_text())
          assert data['canonical_reference'] == 'Agumon'
          assert data['preserved_count'] == 4
          assert {item['name'] for item in data['preserved']} == {'Agumon', 'Greymon', 'Metal Greymon', 'Mochimon'}
          assert data['rebuilt_count'] == 85
          assert data['unresolved'] == []
          assert data['existing_non_agumon_runtime_strips_allowed_as_input'] is False
          assert data['canonical_runtime_order'] == ['down_left', 'down_right', 'up_left', 'up_right']
          assert data['direction_registry'] == 'database/ds-direction-registry.json'
          assert all(item['name'] != 'Agumon' for item in data['rebuilt'])
          print('manifest verified: 4 reviewed/project-owner strips preserved; 85 sprites recreated from fresh sources')
          PY
          python3 tools/validate_early_rank_playables.py
          python3 tools/validate_all_ds_directional_facings.py
          python3 tools/validate_runtime_assets.py

      - name: Render all generated directions for visual audit
        run: python3 tools/render_generated_ds_direction_audit.py

      - name: Upload generated direction audit
        uses: actions/upload-artifact@v4
        with:
          name: ds-generated-direction-audit
          path: /tmp/ds-generated-direction-audit
          retention-days: 3

      - name: Commit exact-registry rebuilt DS sprites when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Exact rebuild is deterministic: fresh-source regeneration matches committed outputs byte-for-byte.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/characters assets/resources database tools/validate_runtime_assets.py
          git commit -m 'fix: regenerate DS fields from exact audited coordinates [skip ds-full-rebuild]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Rebuild additional DS fields from audited sources

on:
  push:
    branches:
      - fix/ds-sprite-agumon-line-*
      - fix/ds-sprite-guilmon-family-additions
      - feat/agumon-evolution-ds-sprites
      - feat/garurumon-line-ds-sprites
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[skip additional-ds-rebuild]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install sprite tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy scipy

      - name: Build higher-rank directional and portrait assets
        run: python3 tools/build_additional_ds_fields.py

      - name: Validate generated assets
        run: |
          python3 tools/validate_additional_ds_fields.py
          python3 tools/validate_all_ds_directional_facings.py

      - name: Commit generated runtime assets when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Additional DS rebuild is deterministic: committed outputs already match the pinned sources.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/characters \
            assets/resources \
            database/additional-ds-playables.json \
            database/ds-directional-resource-audit.json
          git commit -m 'feat: regenerate additional DS runtime sprites [skip additional-ds-rebuild]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

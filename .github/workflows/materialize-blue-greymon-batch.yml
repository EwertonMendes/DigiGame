name: Materialize Blue Greymon batch

on:
  push:
    branches:
      - fix/ds-sprite-agumon-line-veemon-batch

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install sprite tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Configure direct sources and build runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/materialize_blue_greymon_batch.py
          python3 tools/build_additional_ds_fields.py
          python3 tools/validate_additional_ds_fields.py
          python3 tools/validate_all_ds_directional_facings.py
      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/build_additional_ds_fields.py \
            database/ds-additional-sources.json \
            database/additional-ds-playables.json \
            database/ds-directional-resource-audit.json \
            assets/characters/bluegreymon \
            assets/characters/bluemetalgreymon \
            'assets/resources/blue greymon.tres' \
            'assets/resources/blue metal greymon.tres'
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add Blue Greymon DS sprites [skip additional-ds-rebuild]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Materialize portrait resolution fix

on:
  push:
    branches:
      - fix/grass-agumon-portraits

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[skip portrait-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install sprite tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy

      - name: Restore Grass Agumon profile portrait source
        shell: bash
        run: |
          set -euo pipefail
          cat tools/bootstrap-assets/portrait.b64.part0 \
              tools/bootstrap-assets/portrait.b64.part1 \
              tools/bootstrap-assets/portrait.b64.part2 \
              tools/bootstrap-assets/portrait.b64.part3 \
            | base64 -d > assets/characters/grassagumon/source/portrait_frames.png
          echo "7695726c43817175e27213073a2c4b7280e6ea242de9d7d793934df67ad3721c  assets/characters/grassagumon/source/portrait_frames.png" | sha256sum -c -

      - name: Patch shared portrait resolution
        run: python3 tools/bootstrap_portrait_resolution_fix.py

      - name: Rebuild Grass Agumon runtime assets
        run: python3 tools/build_project_original_playables.py

      - name: Validate data and asset contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/enrich_digimon_database.py --check
          python3 tools/validate_digimon_progression.py
          python3 tools/validate_project_original_playables.py
          python3 tools/validate_early_rank_playables.py
          python3 tools/validate_additional_ds_fields.py
          python3 tools/validate_all_ds_directional_facings.py

      - name: Commit materialized fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'Portrait fix is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair Grass Agumon visuals and battle portraits [skip portrait-bootstrap]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

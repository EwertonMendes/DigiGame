name: Bootstrap AncientGreymon DS assets

on:
  push:
    branches:
      - feat/ancientgreymon-ds-sprites

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[skip ancientgreymon-bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install sprite tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy scipy

      - name: Register audited AncientGreymon source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from build_early_rank_ds_fields import load_wtw_archive
          from sync_digimon_database_assets import fetch

          config_path = Path('database/ds-additional-sources.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          source_url = 'https://i874.photobucket.com/albums/ab308/WtWSprites/Ultimate/AncientGreymon.png'
          source_member = 'sprite thread/AncientGreymon.png'

          archive = load_wtw_archive()
          if source_member in archive.namelist():
              payload = archive.read(source_member)
              pinned_member = source_member
          else:
              payload = fetch(source_url)
              pinned_member = None

          spec = {
              'source_id': None,
              'source_sha256': hashlib.sha256(payload).hexdigest(),
              'source_url': source_url,
              'profile': 'two_rows_right_region_of_six',
              'pattern': 'canonical_rows_rear_reversed',
          }
          if pinned_member is not None:
              spec['source_member'] = pinned_member

          config['species']['AncientGreymon'] = spec
          config_path.write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')
          print('AncientGreymon source registered:', json.dumps(spec, indent=2))
          PY

      - name: Build AncientGreymon through the canonical additional-DS pipeline
        run: python3 tools/build_additional_ds_fields.py

      - name: Validate generated field, portrait, resource and directional contract
        run: |
          python3 tools/validate_additional_ds_fields.py
          python3 tools/validate_all_ds_directional_facings.py

      - name: Commit canonical generated outputs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'AncientGreymon outputs already match the audited source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            database/ds-additional-sources.json \
            database/additional-ds-playables.json \
            database/ds-directional-resource-audit.json \
            assets/characters/ancientgreymon \
            'assets/resources/ancientgreymon.tres'
          git commit -m 'feat: generate AncientGreymon runtime assets [skip ancientgreymon-bootstrap]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

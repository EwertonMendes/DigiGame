name: Vendor Brackeys VFX Bundle (temporary)

on:
  push:
    branches:
      - feat/focused-evolution-chart
    paths:
      - .github/workflows/vendor-brackeys-vfx-temp.yml

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DigiGame branch
        uses: actions/checkout@v4
        with:
          ref: feat/focused-evolution-chart
          fetch-depth: 0

      - name: Vendor pinned Brackeys VFX Bundle
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_REPO="https://github.com/Brackeys/vfx-in-godot.git"
          UPSTREAM_COMMIT="23b58f272b828b0a894ed7ef72fbf9033ee9d177"
          DEST="assets/vfx/brackeys"

          rm -rf "$DEST"
          rm -rf /tmp/brackeys-vfx

          git clone --filter=blob:none --no-checkout "$UPSTREAM_REPO" /tmp/brackeys-vfx
          git -C /tmp/brackeys-vfx sparse-checkout init --cone
          git -C /tmp/brackeys-vfx sparse-checkout set vfx/brackeys_particle_bundle
          git -C /tmp/brackeys-vfx checkout "$UPSTREAM_COMMIT"

          mkdir -p "$DEST"
          cp -a /tmp/brackeys-vfx/vfx/brackeys_particle_bundle/. "$DEST"/

          # Godot regenerates these for the final res:// path. Keeping upstream
          # .import metadata would preserve stale source paths/hashes.
          find "$DEST" -type f \( -name '.DS_Store' -o -name '*.import' \) -delete

          cat > "$DEST/README.md" <<'EOF'
          # Brackeys VFX Bundle

          Vendored game-ready source assets from the **Brackeys VFX Bundle** for DigiGame.

          - Upstream project: https://github.com/Brackeys/vfx-in-godot
          - Bundle page: https://brackeysgames.itch.io/brackeys-vfx-bundle
          - Pinned upstream commit: `23b58f272b828b0a894ed7ef72fbf9033ee9d177`
          - License: **CC0 1.0 / public domain** (commercial use and modification permitted; attribution not required)
          - Upstream authors credited by Brackeys: Kenney, Picster, Thomas Iché and CodeManu

          The complete raw bundle is kept under this directory in its original category layout:

          - `flipbooks/` — animated flipbook textures
          - `particles/` — particle textures/masks
          - `predrawn/` — pre-drawn animated VFX spritesheets

          Upstream `.import` files and `.DS_Store` metadata are intentionally not vendored. Godot generates fresh import metadata for DigiGame's final `res://assets/vfx/brackeys/...` paths.

          Do not download these assets at runtime. They are committed so Web/Desktop/Mobile builds remain deterministic and offline-safe.
          EOF

          cat > "$DEST/LICENSE-CC0.md" <<'EOF'
          # License

          The Brackeys VFX Bundle is released under **Creative Commons Zero v1.0 Universal (CC0 1.0)**.

          Brackeys states that the bundle may be distributed, remixed, adapted and used commercially without required attribution.

          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          Bundle source: https://brackeysgames.itch.io/brackeys-vfx-bundle
          Upstream project: https://github.com/Brackeys/vfx-in-godot
          EOF

          (
            cd "$DEST"
            find flipbooks particles predrawn -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum > MANIFEST.sha256
          )

          echo "Vendored files: $(find "$DEST" -type f | wc -l)"
          echo "Vendored size: $(du -sh "$DEST" | cut -f1)"

      - name: Commit vendored assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vfx/brackeys
          git diff --cached --stat
          git commit -m "assets: vendor Brackeys VFX Bundle"
          git push origin HEAD:feat/focused-evolution-chart

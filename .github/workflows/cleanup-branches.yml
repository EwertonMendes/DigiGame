name: Cleanup branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Keep only master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete all remote branches except master
        run: python3 tools/cleanup_branches.py --keep master

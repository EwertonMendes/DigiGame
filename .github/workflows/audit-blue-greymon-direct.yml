name: Audit Blue Greymon direct sources

on:
  push:
    branches:
      - fix/ds-sprite-agumon-line-veemon-batch

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Audit direct Super Xros Wars source sheets
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/netraular/DigimonWorldSpriteManager.git /tmp/digimon-sprite-manager
          PYTHONPATH=tools python3 tools/audit_blue_greymon_sources.py | tee /tmp/blue-greymon-audit-output.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: blue-greymon-direct-audit
          path: /tmp/blue-greymon-audit
          retention-days: 3

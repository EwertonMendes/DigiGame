name: Temporary AncientGreymon direction fix

on:
  push:
    branches:
      - feat/ancientgreymon-ds-sprites

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ancientgreymon-ds-sprites
          fetch-depth: 0

      - name: Install sprite tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy scipy

      - name: Correct AncientGreymon rear-facing mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('database/ds-additional-sources.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          species = data['species']['AncientGreymon']
          old = species['pattern']
          if old not in ('canonical_rows_rear_reversed', 'canonical_rows'):
              raise SystemExit(f'Unexpected AncientGreymon pattern: {old}')
          species['pattern'] = 'canonical_rows'
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Regenerate canonical DS assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_additional_ds_fields.py
          python3 tools/validate_additional_ds_fields.py
          python3 tools/validate_all_ds_directional_facings.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path('assets/characters/ancientgreymon/field.json').read_text(encoding='utf-8'))
          assert meta['review_pattern'] == 'canonical_rows', meta['review_pattern']
          assert meta['runtime_group_indices'] == [0, 1, 2, 3], meta['runtime_group_indices']
          assert meta['canonical_runtime_order'] == ['down_left', 'down_right', 'up_left', 'up_right']
          manifest = json.loads(Path('database/additional-ds-playables.json').read_text(encoding='utf-8'))
          row = next(item for item in manifest['species'] if item['name'] == 'AncientGreymon')
          assert row['pattern'] == 'canonical_rows', row['pattern']
          PY

      - name: Commit corrected generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            database/ds-additional-sources.json \
            database/additional-ds-playables.json \
            assets/characters/ancientgreymon/field.json \
            assets/characters/ancientgreymon/field.png
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'fix: correct AncientGreymon rear facings'
          git push origin HEAD:feat/ancientgreymon-ds-sprites

name: Project-supplied directional regression

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/project-supplied-directional-regression.yml'
      - 'assets/characters/**'
      - 'assets/resources/**'
      - 'database/project-supplied-sources.json'
      - 'database/project-supplied-playables.json'
      - 'database/ds-directional-resource-audit.json'
      - 'tools/build_project_supplied_directional.py'
      - 'tools/validate_project_supplied_directional.py'
      - 'tools/validate_all_ds_directional_facings.py'
      - 'tools/test_project_supplied_directional.gd'
      - 'tools/test_project_supplied_directional.tscn'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install sprite tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy

      - name: Verify deterministic normalized assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_project_supplied_directional.py
          python3 tools/validate_project_supplied_directional.py
          python3 tools/validate_all_ds_directional_facings.py
          git diff --exit-code -- \
            assets/characters \
            assets/resources \
            database/project-supplied-playables.json \
            database/ds-directional-resource-audit.json

      - name: Restore Godot runtime cache
        id: godot-runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/digigame-godot/godot
          key: godot-runtime-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Download Godot on cache miss
        if: steps.godot-runtime.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-stable"
          mkdir -p "$HOME/.cache/digigame-godot"
          curl -fL "https://github.com/godotengine/godot/releases/download/${TAG}/Godot_v${TAG}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${TAG}_linux.x86_64" "$HOME/.cache/digigame-godot/godot"
          chmod +x "$HOME/.cache/digigame-godot/godot"

      - name: Activate Godot
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$HOME/.cache/digigame-godot/godot"
          sudo ln -sf "$HOME/.cache/digigame-godot/godot" /usr/local/bin/godot

      - name: Import project
        run: godot --headless --path . --import

      - name: Exercise battle, overworld and menu sprite consumers
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . tools/test_project_supplied_directional.tscn 2>&1 | tee /tmp/project-supplied.log
          grep -q 'project-supplied directional regression passed' /tmp/project-supplied.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:' /tmp/project-supplied.log; then exit 1; fi

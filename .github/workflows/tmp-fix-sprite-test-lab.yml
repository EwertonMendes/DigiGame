name: Temporary Sprite Test Lab Repair

on:
  push:
    branches:
      - feature/metalgreymon-field-sprite
    paths:
      - .github/workflows/tmp-fix-sprite-test-lab.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/metalgreymon-field-sprite

      - name: Patch sprite lab and regression test
        shell: bash
        run: |
          echo '   ' | base64 -d > /tmp/fix_sprite_lab.py
          python3 /tmp/fix_sprite_lab.py
          rm .github/workflows/tmp-fix-sprite-test-lab.yml

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/DigimonSpriteTestLab.gd tools/test_hub_foundation.gd .github/workflows/tmp-fix-sprite-test-lab.yml
          git commit -m "fix: make sprite test lab work in web exports"
          git push origin HEAD:feature/metalgreymon-field-sprite

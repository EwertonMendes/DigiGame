name: Temporary Sprite Test Lab Repair

on:
  push:
    branches:
      - feature/metalgreymon-field-sprite
    paths:
      - .github/workflows/tmp-fix-sprite-test-lab.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/metalgreymon-field-sprite

      - name: Apply repair
        run: python3 tools/tmp_fix_sprite_lab.py

      - name: Remove temporary repair files
        run: rm tools/tmp_fix_sprite_lab.py .github/workflows/tmp-fix-sprite-test-lab.yml

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make sprite test lab work in web exports"
          git push origin HEAD:feature/metalgreymon-field-sprite

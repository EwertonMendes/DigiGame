name: Project-original playable regression

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/project-original-regression.yml'
      - 'project.godot'
      - 'assets/characters/**'
      - 'assets/resources/**'
      - 'database/**'
      - 'tools/build_project_original_playables.py'
      - 'tools/build_technique_catalog.mjs'
      - 'tools/apply_technique_curation.py'
      - 'tools/enrich_digimon_database.py'
      - 'tools/validate_combat_data.py'
      - 'tools/validate_digimon_progression.py'
      - 'tools/validate_project_original_playables.py'
      - 'tools/validate_early_rank_playables.py'
      - 'tools/validate_all_ds_directional_facings.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Install sprite tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy

      - name: Rebuild project-original playable assets and data
        run: python3 tools/build_project_original_playables.py

      - name: Rebuild permanent technique catalogue deterministically
        run: node tools/build_technique_catalog.mjs

      - name: Apply reviewed technique curation deterministically
        run: python3 tools/apply_technique_curation.py

      - name: Validate data, source contracts and runtime coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/enrich_digimon_database.py --check
          python3 tools/validate_combat_data.py
          python3 tools/validate_digimon_progression.py
          python3 tools/validate_project_original_playables.py
          python3 tools/validate_early_rank_playables.py
          python3 tools/validate_all_ds_directional_facings.py

      - name: Verify every generated output is committed
        run: git diff --exit-code

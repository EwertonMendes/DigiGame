name: Temporary Early-Rank Asset Sync

on:
  push:
    branches:
      - feature/early-rank-digimon-roster
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/early-rank-digimon-roster
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Sync canonical early-rank assets
        run: |
          set -euo pipefail
          python3 tools/sync_digimon_database_assets.py
          python3 tools/validate_early_rank_playables.py

      - name: Commit generated assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/early-rank-playables.json assets/characters assets/resources
          if git diff --cached --quiet; then
            echo 'No generated asset changes.'
            exit 0
          fi
          git commit -m 'feat: generate early-rank Digimon playable assets'
          git push origin HEAD:feature/early-rank-digimon-roster

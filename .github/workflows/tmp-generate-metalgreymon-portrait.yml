name: Temporary MetalGreymon Portrait Generator

on:
  push:
    branches:
      - feature/metalgreymon-field-sprite

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Pillow
        shell: bash
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Generate MetalGreymon portrait runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.sync_digimon_database_assets import build_portrait_assets
          build_portrait_assets("metalgreymon", "MetalGreymon.webp")
          PY
          test -s assets/characters/metalgreymon/source/portrait.webp
          test -s assets/characters/metalgreymon/portrait_frames.png
          test -s assets/characters/metalgreymon/portrait_frames.json

      - name: Upload generated portrait files
        uses: actions/upload-artifact@v4
        with:
          name: metalgreymon-portrait-generated
          path: |
            assets/characters/metalgreymon/source/portrait.webp
            assets/characters/metalgreymon/source/.gdignore
            assets/characters/metalgreymon/portrait_frames.png
            assets/characters/metalgreymon/portrait_frames.json
          if-no-files-found: error
          retention-days: 1

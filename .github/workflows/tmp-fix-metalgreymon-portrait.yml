name: Temporary MetalGreymon Portrait Repair

on:
  push:
    branches:
      - feature/metalgreymon-field-sprite
    paths:
      - .github/workflows/tmp-fix-metalgreymon-portrait.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/metalgreymon-field-sprite

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Rebuild portrait strip
        run: python3 tools/tmp_fix_metalgreymon_portrait.py

      - name: Remove temporary repair files
        run: rm tools/tmp_fix_metalgreymon_portrait.py .github/workflows/tmp-fix-metalgreymon-portrait.yml

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: rebuild MetalGreymon animated portrait strip"
          git push origin HEAD:feature/metalgreymon-field-sprite

name: Materialize reported directional fixes

on:
  push:
    branches:
      - feat/digimon-batch-2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/digimon-batch-2
          fetch-depth: 0

      - name: Install sprite tooling
        run: python3 -m pip install --disable-pip-version-check pillow numpy scipy

      - name: Apply audited direction corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('database/ds-additional-sources.json')
          text = path.read_text(encoding='utf-8')

          anchor = '    "rear_rows_first": [2, 3, 0, 1],\n'
          additions = (
              '    "canonical_rows_front_reversed": [1, 0, 3, 2],\n'
              '    "rear_rows_first_horizontal_reversed": [3, 2, 1, 0],\n'
          )
          if '"canonical_rows_front_reversed"' not in text:
              if anchor not in text:
                  raise SystemExit('Pattern insertion anchor not found')
              text = text.replace(anchor, anchor + additions, 1)

          corrections = {
              'DKTyrannomon': 'canonical_rows',
              'Machinedramon': 'canonical_rows',
              'Growlmon': 'canonical_rows',
              'Tyrannomon': 'canonical_rows_front_reversed',
              'Darkdramon': 'rear_rows_first_horizontal_reversed',
          }
          for species, pattern in corrections.items():
              rx = re.compile(r'("' + re.escape(species) + r'"\s*:\s*\{.*?"pattern"\s*:\s*")[^"]+(" )?', re.S)
              match = rx.search(text)
              if match is None:
                  # Same expression without a trailing-space capture; kept explicit for readable failure.
                  rx = re.compile(r'("' + re.escape(species) + r'"\s*:\s*\{.*?"pattern"\s*:\s*")[^"]+(" )', re.S)
                  match = rx.search(text)
              if match is None:
                  # Normal JSON line ends immediately after the quote.
                  rx = re.compile(r'("' + re.escape(species) + r'"\s*:\s*\{.*?"pattern"\s*:\s*")[^"]+(")', re.S)
                  match = rx.search(text)
              if match is None:
                  raise SystemExit(f'Could not find pattern for {species}')
              text = text[:match.start()] + match.group(1) + pattern + match.group(2) + text[match.end():]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Rebuild generated DS assets
        run: python3 tools/build_additional_ds_fields.py

      - name: Validate corrected facings
        run: |
          python3 tools/validate_additional_ds_fields.py
          python3 tools/validate_all_ds_directional_facings.py

      - name: Commit materialized corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/ds-additional-sources.json database/additional-ds-playables.json database/ds-directional-resource-audit.json assets/characters assets/resources
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'fix: correct reported Digimon directional facings'
          git push origin HEAD:feat/digimon-batch-2

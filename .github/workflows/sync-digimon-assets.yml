name: Sync Digimon assets

on:
  push:
    branches:
      - feat/tile-blocking-digimon-hover-details
    paths:
      - '.github/workflows/sync-digimon-assets.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/tile-blocking-digimon-hover-details
          fetch-depth: 0

      - name: Sync canonical database and animated portraits
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 tools/sync_digimon_database_assets.py

      - name: Commit generated assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database assets/characters
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "chore: organize Digimon assets and sync database"
          git push origin HEAD:feat/tile-blocking-digimon-hover-details
